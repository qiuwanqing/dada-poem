<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>clear dada poem cache</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    #status {
      max-width: 280px;
      font-size: 16px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="status">Clearing dada poem cache...</div>

  <script>
    (async () => {
      const status = document.getElementById("status");
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            await registration.unregister();
          }
        }

        if ("caches" in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
        }

        status.textContent = "Cleared. Close Safari completely, then reopen dada poem.";
      } catch (err) {
        status.textContent = "Clear failed: " + (err && err.message ? err.message : String(err));
      }
    })();
  </script>
</body>
</html>
