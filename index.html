    function cssRectToVideoCrop(cssRect){
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return null;

      const sr = stage.getBoundingClientRect();
      const sw = sr.width, sh = sr.height;
      const videoAspect = vw / vh;
      const stageAspect = sw / sh;

      let drawW, drawH, offsetX, offsetY;
      if (stageAspect > videoAspect) {
        // stage wider: video width fills stage, top/bottom cropped
        drawW = sw;
        drawH = sw / videoAspect;
        offsetX = 0;
        offsetY = (sh - drawH) / 2;
      } else {
        // stage taller: video height fills stage, left/right cropped
        drawH = sh;
        drawW = sh * videoAspect;
        offsetY = 0;
        offsetX = (sw - drawW) / 2;
      }

      const isMirrored = (facingMode === "user");

      let nx = (cssRect.x - offsetX) / drawW;
      const ny = (cssRect.y - offsetY) / drawH;
      const nw = cssRect.w / drawW;
      const nh = cssRect.h / drawH;

      if (isMirrored) nx = 1 - nx - nw;

      let sx = Math.round(nx * vw);
      let sy = Math.round(ny * vh);
      let swp = Math.round(nw * vw);
      let shp = Math.round(nh * vh);

      sx = clamp(sx, 0, vw-1);
      sy = clamp(sy, 0, vh-1);
      swp = clamp(swp, 1, vw - sx);
      shp = clamp(shp, 1, vh - sy);

      return { sx, sy, sw: swp, sh: shp };
    }

    function addStickerFromCanvas(srcCanvas, cssRect){
      const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));

      const stCanvas = document.createElement("canvas");
      stCanvas.className = "sticker";
      stCanvas.style.left = cssRect.x + "px";
      stCanvas.style.top  = cssRect.y + "px";
      stCanvas.style.width  = cssRect.w + "px";
      stCanvas.style.height = cssRect.h + "px";

      stCanvas.width  = Math.round(cssRect.w * dpr);
      stCanvas.height = Math.round(cssRect.h * dpr);

      const ctx = stCanvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(srcCanvas, 0,0, stCanvas.width, stCanvas.height);

      stage.appendChild(stCanvas);

      const st = { el: stCanvas, x: cssRect.x, y: cssRect.y, w: cssRect.w, h: cssRect.h, scale: 1, rot: 0,
      blurPx: 0 ,
      vx: 0, vy: 0, av: 0, _physLock: false

      };
      stickers.push(st);

      applyStickerCssFilter(st);   // ⭐⭐⭐ 关键

      attachStickerInteractions(st);
      selectSticker(st);
      return st;
    }

    function alphaHitTest(canvasEl, clientX, clientY){
      try{
        const r = canvasEl.getBoundingClientRect();
        const d = canvasEl.width / r.width;
        const px = (clientX - r.left) * d;
        const py = (clientY - r.top) * d;
        if (px < 0 || py < 0 || px >= canvasEl.width || py >= canvasEl.height) return false;
        const a = canvasEl.getContext("2d").getImageData(px|0, py|0, 1, 1).data[3];
        return a !== 0;
      }catch{
        return true;
      }
    }

    function getLocalPointOnCanvas(canvasEl, clientX, clientY){
      const r = canvasEl.getBoundingClientRect();
      if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) return null;
      const x = (clientX - r.left) / r.width * canvasEl.width;
      const y = (clientY - r.top) / r.height * canvasEl.height;
      return { x, y };
    }

    function copyCanvas(source){
      const copy = document.createElement("canvas");
      copy.width = source.width;
      copy.height = source.height;
      copy.getContext("2d").drawImage(source, 0, 0);
      return copy;
    }

    function setCutTool(tool){
      cutTool = tool;
      document.querySelectorAll("#cutToolRingContainer [data-cut-tool]").forEach(btn=>{
        btn.classList.toggle("active", btn.dataset.cutTool === tool);
        btn.style.transform = btn.dataset.cutTool === tool
          ? "translate(-50%, -50%) scale(1.30)"
          : "translate(-50%, -50%) scale(1)";
        btn.style.filter = btn.dataset.cutTool === tool ? "brightness(1.35)" : "none";
      });
      const messages = {
        mp: "CUT MP: tap inside the sticker",
        draw: "CUT DRAW: draw the area to keep",
        rect: "CUT RECT: drag the area to keep",
        erase: "CUT ERASE: paint pixels away",
        restore: "CUT RESTORE: paint original pixels back"
      };
      showHint(messages[tool] || "CUT", 900);
    }

    function closeCutToolRing(){
      document.getElementById("cutToolRingContainer")?.remove();
    }

    function showCutToolRing(clientX, clientY){
      closeCutToolRing();

      const container = document.createElement("div");
      container.id = "cutToolRingContainer";
      document.body.appendChild(container);

      const pad = 116;
      let cx = clamp(clientX, pad, window.innerWidth - pad);
      let cy = clamp(clientY, pad, window.innerHeight - pad);
      const items = [
        { tool:"mp",      png:"MP.png",      alt:"MP",      w:32, r:78 },
        { tool:"draw",    png:"draw2.png",   alt:"DRAW",    w:42, r:82 },
        { tool:"rect",    png:"rect.png",    alt:"RECT",    w:26, r:86 },
        { tool:"erase",   png:"erase.png",   alt:"ERASE",   w:35, r:84 },
        { tool:"restore", png:"restore.png", alt:"RESTORE", w:45, r:80 }
      ];
      const arcCenter = Math.PI;
      const arcSpread = 86 * Math.PI / 180;
      let centerRotation = Math.PI;
      let draggingDial = false;
      let movingRing = false;
      let hoveredIdx = -1;
      let centerPointerId = null;
      let centerStartX = 0;
      let centerStartY = 0;
      let moveOffsetX = 0;
      let moveOffsetY = 0;
      let moveTimer = 0;
      const moveLongPressMs = 420;
      const rotateThreshold = 7;

      function itemAngle(i){
        const t = items.length > 1 ? i / (items.length - 1) : 0.5;
        return arcCenter + arcSpread / 2 - t * arcSpread;
      }

      const center = document.createElement("img");
      center.id = "cutToolRingCenter";
      center.src = "assets/round.png";
      center.alt = "";
      center.draggable = false;
      center.style.left = `${cx}px`;
      center.style.top = `${cy}px`;
      container.appendChild(center);

      const btnEls = items.map((item, i)=>{
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cutToolRingBtn";
        btn.dataset.cutTool = item.tool;
        const angle = itemAngle(i);
        btn.style.left = `${cx + Math.cos(angle) * item.r}px`;
        btn.style.top = `${cy + Math.sin(angle) * item.r}px`;
        const img = document.createElement("img");
        img.src = `assets/${item.png}`;
        img.alt = item.alt;
        img.style.width = `${item.w}px`;
        btn.appendChild(img);
        btn.addEventListener("click", (e)=>{
          e.preventDefault();
          e.stopPropagation();
          setCutTool(item.tool);
        });
        container.appendChild(btn);
        return btn;
      });

      function updateRingPosition(){
        center.style.left = `${cx}px`;
        center.style.top = `${cy}px`;
        items.forEach((item, i)=>{
          const angle = itemAngle(i);
          btnEls[i].style.left = `${cx + Math.cos(angle) * item.r}px`;
          btnEls[i].style.top = `${cy + Math.sin(angle) * item.r}px`;
        });
      }

      function updateCenterRotation(){
        center.style.transform = `translate(-50%, -50%) rotate(${centerRotation - Math.PI}rad)`;
      }

      function highlightNearest(pointerAngle){
        let bestIdx = -1;
        let bestDist = Infinity;
        items.forEach((item, i)=>{
          let diff = pointerAngle - itemAngle(i);
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          if (Math.abs(diff) < bestDist){
            bestDist = Math.abs(diff);
            bestIdx = i;
          }
        });
        btnEls.forEach((btn, i)=>{
          btn.style.transform = i === bestIdx
            ? "translate(-50%, -50%) scale(1.32)"
            : "translate(-50%, -50%) scale(1)";
          btn.style.filter = i === bestIdx ? "brightness(1.36)" : "none";
        });
        if (bestIdx >= 0 && bestIdx !== hoveredIdx) hapticTick();
        return bestIdx;
      }

      center.addEventListener("pointerdown", (e)=>{
        centerPointerId = e.pointerId;
        centerStartX = e.clientX;
        centerStartY = e.clientY;
        draggingDial = false;
        movingRing = false;
        hoveredIdx = -1;
        center.setPointerCapture?.(e.pointerId);
        clearTimeout(moveTimer);
        moveTimer = setTimeout(()=>{
          movingRing = true;
          moveOffsetX = e.clientX - cx;
          moveOffsetY = e.clientY - cy;
          center.style.filter = "brightness(1.14)";
          center.style.cursor = "grabbing";
        }, moveLongPressMs);
        e.preventDefault();
        e.stopPropagation();
      });

      center.addEventListener("pointermove", (e)=>{
        if (centerPointerId !== e.pointerId) return;
        const moved = Math.hypot(e.clientX - centerStartX, e.clientY - centerStartY);
        if (movingRing){
          cx = clamp(e.clientX - moveOffsetX, pad, window.innerWidth - pad);
          cy = clamp(e.clientY - moveOffsetY, pad, window.innerHeight - pad);
          updateRingPosition();
        } else {
          if (!draggingDial && moved > rotateThreshold){
            clearTimeout(moveTimer);
            draggingDial = true;
          }
          if (draggingDial){
            const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
            centerRotation = angle;
            updateCenterRotation();
            hoveredIdx = highlightNearest(angle);
          }
        }
        e.preventDefault();
      });

      const finishDial = (e)=>{
        if (centerPointerId !== e.pointerId) return;
        clearTimeout(moveTimer);
        if (draggingDial && hoveredIdx >= 0) setCutTool(items[hoveredIdx].tool);
        centerPointerId = null;
        draggingDial = false;
        movingRing = false;
        center.style.filter = "";
        center.style.cursor = "grab";
        e.preventDefault();
      };
      center.addEventListener("pointerup", finishDial);
      center.addEventListener("pointercancel", finishDial);

      updateRingPosition();
      updateCenterRotation();
      setCutTool(cutTool);
    }

    function beginCutMode(){
      if (!selected) return;
      if (!cutSession || cutSession.st !== selected){
        cutSession = {
          st: selected,
          originalSnap: captureStickerState(selected),
          sourceCanvas: copyCanvas(selected.el),
          changed: false
        };
      }
      editMode = "cut";
      brushPanel.style.display = "none";
      sidebar.style.display = "none";
      stage.classList.add("cutPreviewActive");
      const selectedRect = selected.el.getBoundingClientRect();
      const ringX = selectedRect.right + 12;
      const ringY = selectedRect.top + selectedRect.height * 0.72;
      showCutToolRing(ringX, ringY);
      setCutTool(cutTool || "rect");
    }

    function finishCutMode({ commit = true } = {}){
      if (!cutSession) return false;
      const session = cutSession;
      cutSession = null;
      closeCutToolRing();
      editMode = "stretch";
      stage.classList.remove("cutPreviewActive");
      hideROI();
      clearPathPreview();

      if (!commit){
        restoreStickerState(session.st, session.originalSnap);
        return true;
      }

      if (session.changed && session.originalSnap){
        paintUndoStack.push(session.originalSnap);
        paintRedoStack = [];
        if (paintUndoStack.length > 24) paintUndoStack.shift();
        trimStickerCanvasToContent(session.st, 2);
      }
      return true;
    }

    function resetCutToStart(){
      if (!cutSession || cutSession.st !== selected || !cutSession.originalSnap) return false;
      restoreStickerState(cutSession.st, cutSession.originalSnap);
      cutSession.changed = false;
      hideROI();
      clearPathPreview();
      showHint("CUT reset to start", 750);
      return true;
    }

    function keepCutRect(canvas, a, b){
      const x = Math.min(a.x, b.x);
      const y = Math.min(a.y, b.y);
      const w = Math.abs(b.x - a.x);
      const h = Math.abs(b.y - a.y);
      if (w < 2 || h < 2) return;
      const ctx = canvas.getContext("2d");
      ctx.save();
      ctx.globalCompositeOperation = "destination-in";
      ctx.fillStyle = "#000";
      ctx.fillRect(x, y, w, h);
      ctx.restore();
      if (cutSession) cutSession.changed = true;
    }

    function keepCutPath(canvas, points){
      if (!points || points.length < 3) return;
      const ctx = canvas.getContext("2d");
      ctx.save();
      ctx.globalCompositeOperation = "destination-in";
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      points.slice(1).forEach(p=>ctx.lineTo(p.x, p.y));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      if (cutSession) cutSession.changed = true;
    }

    function paintCutBrush(canvas, point, restore){
      const ctx = canvas.getContext("2d");
      const cssScale = canvas.width / Math.max(1, canvas.getBoundingClientRect().width);
      const radius = 24 * cssScale;
      ctx.save();
      ctx.beginPath();
      ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
      ctx.clip();
      if (restore && cutSession?.sourceCanvas){
        ctx.globalCompositeOperation = "source-over";
        ctx.drawImage(cutSession.sourceCanvas, 0, 0);
      } else {
        ctx.globalCompositeOperation = "destination-out";
        ctx.fillStyle = "#000";
        ctx.fillRect(point.x - radius, point.y - radius, radius * 2, radius * 2);
      }
      ctx.restore();
      if (cutSession) cutSession.changed = true;
    }

    async function applyCutMP(st, local){
      if (!interactiveSegmenter){
        showHint("MediaPipe model is not ready", 900);
        return;
      }
      showHint("Cutting...", 700);
      try{
        const result = await new Promise((resolve, reject)=>{
          try{
            interactiveSegmenter.segment(st.el, {
              keypoint: {
                x: clamp(local.x / st.el.width, 0, 1),
                y: clamp(local.y / st.el.height, 0, 1)
              }
            }, resolve);
          }catch(err){
            reject(err);
          }
        });
        if (!result?.categoryMask) throw new Error("No segmentation mask");

        const mask = result.categoryMask.getAsFloat32Array();
        const ctx = st.el.getContext("2d", { willReadFrequently:true });
        const img = ctx.getImageData(0, 0, st.el.width, st.el.height);
        const px = clamp(Math.floor(local.x), 0, st.el.width - 1);
        const py = clamp(Math.floor(local.y), 0, st.el.height - 1);
        const clicked = mask[py * st.el.width + px] >= 0.4;
        const count = Math.min(mask.length, st.el.width * st.el.height);
        for (let i = 0; i < count; i++){
          if ((mask[i] >= 0.4) !== clicked) img.data[i * 4 + 3] = 0;
        }
        ctx.putImageData(img, 0, 0);
        result.categoryMask.close?.();
        if (cutSession) cutSession.changed = true;
        showHint("CUT MP applied", 700);
      }catch(err){
        console.error("cut MP failed:", err);
        showHint("CUT MP failed", 900);
      }
    }

    function attachStickerInteractions(st){
      const el = st.el;

      let isDown = false;
      let startX=0, startY=0;
      let baseLeft=0, baseTop=0;
      let moved = false;
      let moveUndoCaptured = false;
      const DRAG_THRESHOLD = 6;
      let lastLocal = null;
      let cutStartLocal = null;
      let cutPathLocal = [];
      let cutStartStage = null;
      let cutPathStage = [];

      el.addEventListener("pointerdown", (e)=>{
        const isCuttingThisSticker = cutSession?.st === st;
        if (!isCuttingThisSticker && !alphaHitTest(el, e.clientX, e.clientY)) return;

        if (funcCircleOpen) return;

        e.preventDefault();
        e.stopPropagation();

        isDown = true;
        moved = false;
        moveUndoCaptured = false;

        startX = e.clientX;
        startY = e.clientY;
        baseLeft = st.x;
        baseTop  = st.y;

        selectSticker(st);

        // ✅ gravity/physics: dragging locks physics
        st._physLock = true;
        st.vx = st.vy = st.av = 0;

        if (isCuttingThisSticker){
          lastLocal = getLocalPointOnCanvas(el, e.clientX, e.clientY);
          cutStartLocal = lastLocal;
          cutPathLocal = lastLocal ? [lastLocal] : [];
          cutStartStage = localPointFromClient(e.clientX, e.clientY);
          cutPathStage = cutStartStage ? [{ x:cutStartStage.x, y:cutStartStage.y }] : [];
          if (cutTool === "mp" && lastLocal){
            applyCutMP(st, lastLocal);
          }
          if ((cutTool === "erase" || cutTool === "restore") && lastLocal){
            paintCutBrush(el, lastLocal, cutTool === "restore");
          }
        } else if (editbar.style.display === "flex" || brushPanel.style.display === "flex") {
          lastLocal = getLocalPointOnCanvas(el, e.clientX, e.clientY);
          pushUndoForSelected();
        } else {
          lastLocal = null;
        }

        el.setPointerCapture(e.pointerId);
      }, { passive:false });

      el.addEventListener("pointermove", (e)=>{
        if (!isDown || selected !== st) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const dist = Math.hypot(dx, dy);

        if (cutSession?.st === st){
          const local = getLocalPointOnCanvas(el, e.clientX, e.clientY);
          if (!local) return;
          if (cutTool === "draw"){
            cutPathLocal.push(local);
            const stagePoint = localPointFromClient(e.clientX, e.clientY);
            cutPathStage.push({ x:stagePoint.x, y:stagePoint.y });
            drawPathPreview(cutPathStage);
          }
          if (cutTool === "rect" && cutStartStage){
            const stagePoint = localPointFromClient(e.clientX, e.clientY);
            showROI({
              x:Math.min(cutStartStage.x, stagePoint.x),
              y:Math.min(cutStartStage.y, stagePoint.y),
              w:Math.abs(stagePoint.x - cutStartStage.x),
              h:Math.abs(stagePoint.y - cutStartStage.y)
            });
          }
          if (cutTool === "erase" || cutTool === "restore"){
            paintCutBrush(el, local, cutTool === "restore");
          }
          lastLocal = local;
          e.preventDefault();
          return;
        }

        if (editbar.style.display !== "flex" && !funcCircleOpen && brushPanel.style.display !== "flex") {
          if (dist > DRAG_THRESHOLD) moved = true;
          if (!moved) return;
          if (!moveUndoCaptured) {
            pushUndoForSelected();
            moveUndoCaptured = true;
          }

          st.x = baseLeft + dx;
          st.y = baseTop  + dy;
          el.style.left = st.x + "px";
          el.style.top  = st.y + "px";
          e.preventDefault();
          return;
        }

// ===== edit mode painting =====
const local = getLocalPointOnCanvas(el, e.clientX, e.clientY);
if (!local) return;

const radius = getBrushRadius();

// strength slider -> 0..1
const s = Math.abs(getBrushStrength()) / 100;

if (editMode === "stretch"){
  const base = getBrushStrength() / 100;
  const strength = Math.max(-1.25, Math.min(1.25, base * 1.35));

  if (lastLocal){
    const vx = local.x - lastLocal.x;
    const vy = local.y - lastLocal.y;
    applySmear(el, local.x, local.y, radius, vx, vy, strength);
  }
  lastLocal = local;
  e.preventDefault();
  return;
}

if (editMode === "mosaic"){
  const blockSize = Math.round(4 + s * 36); // 4~40
  applyMosaicBrush(el, local.x, local.y, radius, blockSize);
  lastLocal = local;
  e.preventDefault();
  return;
}

if (editMode === "mblur"){
  const blurPx = Math.round(2 + s * 22); // 2~24
  applyLocalBlurBrush(el, local.x, local.y, radius, blurPx);
  lastLocal = local;
  e.preventDefault();
  return;
}
      }, { passive:false });

      const end = (e)=>{
        if (cutSession?.st === st){
          const endLocal = getLocalPointOnCanvas(el, e.clientX, e.clientY) || lastLocal;
          if (cutTool === "rect" && cutStartLocal && endLocal){
            keepCutRect(el, cutStartLocal, endLocal);
          }
          if (cutTool === "draw"){
            keepCutPath(el, cutPathLocal);
          }
          hideROI();
          clearPathPreview();
        }
        isDown = false;
        lastLocal = null;
        cutStartLocal = null;
        cutPathLocal = [];
        cutStartStage = null;
        cutPathStage = [];
        moved = false;
        try{ el.releasePointerCapture(e.pointerId); }catch{}
        st._physLock = false; // ✅ release lock
      };
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", end);
    }

    function applySmear(canvas, cx, cy, radius, vx, vy, strength){
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;

      const src = ctx.getImageData(0,0,w,h);
      const dst = ctx.createImageData(w,h);
      dst.data.set(src.data);

      const r2 = radius * radius;

      const x0 = Math.max(0, Math.floor(cx - radius));
      const x1 = Math.min(w - 1, Math.ceil(cx + radius));
      const y0 = Math.max(0, Math.floor(cy - radius));
      const y1 = Math.min(h - 1, Math.ceil(cy + radius));

      const len = Math.hypot(vx, vy) || 1;
      const ux = vx / len;
      const uy = vy / len;

      const push = Math.min(36, len) * (0.9 + Math.abs(strength) * 1.3) * Math.sign(strength || 1);

      for (let y = y0; y <= y1; y++){
        for (let x = x0; x <= x1; x++){
          const dx = x - cx, dy = y - cy;
          const d2 = dx*dx + dy*dy;
          if (d2 > r2) continue;

          const d = Math.sqrt(d2);
          const t = 1 - d / radius;
          const falloff = t * t;

          const sx = x - ux * push * falloff;
          const sy = y - uy * push * falloff;

          const ix = Math.max(0, Math.min(w - 1, Math.round(sx)));
          const iy = Math.max(0, Math.min(h - 1, Math.round(sy)));

          const si = (iy*w + ix)*4;
          const di = (y*w + x)*4;

          dst.data[di]     = src.data[si];
          dst.data[di + 1] = src.data[si + 1];
          dst.data[di + 2] = src.data[si + 2];
          dst.data[di + 3] = src.data[si + 3];
        }
      }
      ctx.putImageData(dst, 0,0);
    }

  // ===== Mosaic Brush (Square pixelate in local patch) =====
  function applyMosaicBrush(canvas, cx, cy, radius, blockSizePx){
    const ctx = canvas.getContext("2d", { willReadFrequently:true });
    const w = canvas.width, h = canvas.height;

    const r = Math.max(4, radius|0);
    const bs = Math.max(2, blockSizePx|0);

    const x0 = clamp((cx - r)|0, 0, w-1);
    const y0 = clamp((cy - r)|0, 0, h-1);
    const x1 = clamp((cx + r)|0, 0, w);
    const y1 = clamp((cy + r)|0, 0, h);

    const pw = Math.max(1, x1 - x0);
    const ph = Math.max(1, y1 - y0);

    const patch = ctx.getImageData(x0, y0, pw, ph);

    const dw = Math.max(1, Math.round(pw / bs));
    const dh = Math.max(1, Math.round(ph / bs));

    const tmp1 = document.createElement("canvas");
    tmp1.width = pw; tmp1.height = ph;
    tmp1.getContext("2d").putImageData(patch, 0, 0);

    const tmp2 = document.createElement("canvas");
    tmp2.width = dw; tmp2.height = dh;
    const t2 = tmp2.getContext("2d");
    t2.imageSmoothingEnabled = true;
    t2.clearRect(0,0,dw,dh);
    t2.drawImage(tmp1, 0,0, pw,ph, 0,0, dw,dh);

    const tmp3 = document.createElement("canvas");
    tmp3.width = pw; tmp3.height = ph;
    const t3 = tmp3.getContext("2d");
    t3.imageSmoothingEnabled = false;
    t3.clearRect(0,0,pw,ph);
    t3.drawImage(tmp2, 0,0, dw,dh, 0,0, pw,ph);

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);  // 圆形笔刷
    // 方形笔刷就改成：ctx.rect(cx-r, cy-r, 2*r, 2*r);
    ctx.clip();

    ctx.drawImage(tmp3, x0, y0);
    ctx.restore();
  }

  // ===== Local Blur Brush =====
  function applyLocalBlurBrush(canvas, cx, cy, radius, blurPx){
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const r  = Math.max(6, radius|0);
    const bp = clamp(blurPx|0, 1, 30);

    const x0 = clamp((cx - r - 2)|0, 0, w-1);
    const y0 = clamp((cy - r - 2)|0, 0, h-1);
    const x1 = clamp((cx + r + 2)|0, 0, w);
    const y1 = clamp((cy + r + 2)|0, 0, h);

    const pw = Math.max(1, x1 - x0);
    const ph = Math.max(1, y1 - y0);

    const tmp = document.createElement("canvas");
    tmp.width = pw; tmp.height = ph;
    const tctx = tmp.getContext("2d");
    tctx.drawImage(canvas, x0, y0, pw, ph, 0, 0, pw, ph);

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    // 方形笔刷就改成：ctx.rect(cx-r, cy-r, 2*r, 2*r);
    ctx.clip();

    ctx.filter = `blur(${bp}px)`;
    ctx.drawImage(tmp, x0, y0);

    ctx.restore();
  }


    function captureStickerState(st){
      if (!st?.el) return null;
      const ctx = st.el.getContext("2d");
      let imageData = null;
      try{
        imageData = ctx.getImageData(0,0, st.el.width, st.el.height);
      }catch{}
      return {
        imageData,
        canvasW: st.el.width,
        canvasH: st.el.height,
        x: st.x,
        y: st.y,
        w: st.w,
        h: st.h,
        scale: st.scale,
        rot: st.rot,
        blurPx: st.blurPx || 0,
        sideOn: !!st.sideOn
      };
    }

    function restoreStickerState(st, snap){
      if (!st?.el || !snap) return false;

      st.x = snap.x;
      st.y = snap.y;
      st.w = snap.w;
      st.h = snap.h;
      st.scale = snap.scale;
      st.rot = snap.rot;
      st.blurPx = snap.blurPx || 0;
      st.sideOn = !!snap.sideOn;

      st.el.style.left = st.x + "px";
      st.el.style.top = st.y + "px";
      st.el.style.width = st.w + "px";
      st.el.style.height = st.h + "px";

      if (snap.canvasW && snap.canvasH && (st.el.width !== snap.canvasW || st.el.height !== snap.canvasH)){
        st.el.width = snap.canvasW;
        st.el.height = snap.canvasH;
      }

      if (snap.imageData){
        st.el.getContext("2d").putImageData(snap.imageData, 0, 0);
      }

      applyTransform(st);
      applyStickerCssFilter(st);
      st.el.classList.add("selected");
      return true;
    }

    function pushUndoForSelected(){
      if (!selected) return false;
      const snap = captureStickerState(selected);
      if (!snap) return false;
      paintUndoStack.push(snap);
      paintRedoStack = [];
      if (paintUndoStack.length > 24) paintUndoStack.shift();
      return true;
    }

    function undoSelectedSticker(){
      if (cutSession?.st === selected){
        return resetCutToStart();
      }
      if (!selected || paintUndoStack.length === 0) return false;
      const current = captureStickerState(selected);
      const prev = paintUndoStack.pop();
      if (current) paintRedoStack.push(current);
      if (paintRedoStack.length > 24) paintRedoStack.shift();
      restoreStickerState(selected, prev);
      showHint("undo", 650);
      return true;
    }

    function redoSelectedSticker(){
      if (!selected || paintRedoStack.length === 0) return false;
      const current = captureStickerState(selected);
      const next = paintRedoStack.pop();
      if (current) paintUndoStack.push(current);
      if (paintUndoStack.length > 24) paintUndoStack.shift();
      restoreStickerState(selected, next);
      showHint("redo", 650);
      return true;
    }

// 快速模糊：用 ctx.filter（性能好，iOS 也支持）
function applyGaussianBlur(px){
  if (!selected) return;
  if (!pushUndoForSelected()) return;

  const c = selected.el;
  const ctx = c.getContext("2d");
  const tmp = document.createElement("canvas");
  tmp.width = c.width;
  tmp.height = c.height;

  const tctx = tmp.getContext("2d");
  tctx.clearRect(0,0,tmp.width,tmp.height);
  tctx.drawImage(c, 0,0);

  ctx.save();
  ctx.clearRect(0,0,c.width,c.height);
  ctx.filter = `blur(${px}px)`;
  ctx.drawImage(tmp, 0,0);
  ctx.restore();
}

function applyBlackWhite(amount = 1){
  if (!selected) return;
  if (!pushUndoForSelected()) return;

  const c = selected.el;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  const img = ctx.getImageData(0,0,c.width,c.height);
  const d = img.data;

  const mix = clamp(amount, 0, 1);

  for (let i=0; i<d.length; i+=4){
    const a = d[i+3];
    if (a === 0) continue;
    const r = d[i], g = d[i+1], b = d[i+2];
    // 更接近人眼的灰度
    const y = (0.2126*r + 0.7152*g + 0.0722*b) | 0;
    d[i]   = clamp(r + (y - r) * mix, 0, 255);
    d[i+1] = clamp(g + (y - g) * mix, 0, 255);
    d[i+2] = clamp(b + (y - b) * mix, 0, 255);
  }
  ctx.putImageData(img, 0,0);
}

    // amount: 0~1，建议 0.1~0.35
    function applyNoise(amount){
      if (!selected) return;
      if (!pushUndoForSelected()) return;

      const c = selected.el;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      const img = ctx.getImageData(0,0,c.width,c.height);
      const d = img.data;

      const amp = Math.max(0, Math.min(1, amount)) * 255;

      for (let i=0; i<d.length; i+=4){
        const a = d[i+3];
        if (a === 0) continue;
        const n = (Math.random()*2 - 1) * amp;
        d[i]   = clamp(d[i]   + n, 0, 255);
        d[i+1] = clamp(d[i+1] + n, 0, 255);
        d[i+2] = clamp(d[i+2] + n, 0, 255);
      }
      ctx.putImageData(img, 0,0);
    }

    function ensureCanvasPadding(st, padPx){
      if (!st?.el || padPx <= 0) return;

      const c = st.el;
      const cssW = st.w;
      const dpr = c.width / cssW;

      const pad = Math.ceil(padPx * dpr);

      const needW = c.width + pad * 2;
      const needH = c.height + pad * 2;

      const out = document.createElement("canvas");
      out.className = "sticker";
      out.width = needW;
      out.height = needH;

      out.style.left = c.style.left;
      out.style.top  = c.style.top;
      out.style.width  = (st.w + padPx * 2) + "px";
      out.style.height = (st.h + padPx * 2) + "px";
      out.style.transform = c.style.transform;
      out.style.filter = c.style.filter;
      out.style.borderRadius = c.style.borderRadius;
      out.style.border = c.style.border;

      const ctx = out.getContext("2d");
      ctx.drawImage(c, pad, pad);

      c.replaceWith(out);
      st.el = out;

      st.x -= padPx;
      st.y -= padPx;
      st.w += padPx * 2;
      st.h += padPx * 2;

      out.style.left = st.x + "px";
      out.style.top  = st.y + "px";

      attachStickerInteractions(st);

      if (selected === st) out.classList.add("selected");
    }

    // ===== Edge -> Side Extrude =====

    // 提取“边缘像素”canvas：只保留 alpha 边界的颜色
    function buildEdgeCanvas(srcCanvas){
      const w = srcCanvas.width, h = srcCanvas.height;
      const sctx = srcCanvas.getContext("2d", { willReadFrequently: true });
      const src = sctx.getImageData(0,0,w,h);
      const sd = src.data;

      const out = document.createElement("canvas");
      out.width = w; out.height = h;
      const octx = out.getContext("2d", { willReadFrequently: true });
      const edge = octx.createImageData(w,h);
      const ed = edge.data;

      const A_TH = 8; // alpha 阈值：避免半透明噪点被当边缘

      function alphaAt(x,y){
        if (x<0||y<0||x>=w||y>=h) return 0;
        return sd[(y*w + x)*4 + 3];
      }

      for (let y=0; y<h; y++){
        for (let x=0; x<w; x++){
          const i = (y*w + x)*4;
          const a = sd[i+3];
          if (a <= A_TH) continue;

          // 4 邻域只要有一个是透明 => 这是边缘
          const n0 = alphaAt(x-1,y) <= A_TH;
          const n1 = alphaAt(x+1,y) <= A_TH;
          const n2 = alphaAt(x,y-1) <= A_TH;
          const n3 = alphaAt(x,y+1) <= A_TH;

          if (n0 || n1 || n2 || n3){
            ed[i]   = sd[i];
            ed[i+1] = sd[i+1];
            ed[i+2] = sd[i+2];
            ed[i+3] = a; // 保留原 alpha
          }
        }
      }

      octx.putImageData(edge, 0,0);
      return out;
    }

    function getEdgeAverageColor(srcCanvas){
      const edge = buildEdgeCanvas(srcCanvas);
      const ctx = edge.getContext("2d", { willReadFrequently:true });
      const img = ctx.getImageData(0,0,edge.width,edge.height).data;

      let r=0,g=0,b=0, wsum=0;
      for (let i=0; i<img.length; i+=4){
        const a = img[i+3];
        if (a === 0) continue;
        const w = a / 255;
        r += img[i] * w;
        g += img[i+1] * w;
        b += img[i+2] * w;
        wsum += w;
      }
      if (!wsum) return { r:180, g:180, b:180 }; // fallback
      return { r: (r/wsum)|0, g:(g/wsum)|0, b:(b/wsum)|0 };
    }

    function snapshotStickerBase(st){
      const c = st.el;
      const base = document.createElement("canvas");
      base.width = c.width;
      base.height = c.height;
      base.getContext("2d").drawImage(c, 0, 0);
      st._sideBaseCanvas = base;          // ✅ 用 canvas 存快照
    }

    function restoreStickerBase(st){
      const base = st?._sideBaseCanvas;
      if (!base) return;
      const c = st.el;
      const ctx = c.getContext("2d");
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,c.width,c.height);  // ✅ 先清空，避免脏残留
      ctx.drawImage(base, 0, 0);
    }

    function expandStickerCanvasForSide(st){
      if (!st?.el || st._sideFullscreenCanvas) return;

      const c = st.el;
      const stageRect = stage.getBoundingClientRect();
      const nextW = Math.max(st.w, stageRect.width);
      const nextH = Math.max(st.h, stageRect.height);
      const oldCenterX = st.x + st.w / 2;
      const oldCenterY = st.y + st.h / 2;
      const nextX = oldCenterX - nextW / 2;
      const nextY = oldCenterY - nextH / 2;
      const dpr = c.width / st.w;

      const out = document.createElement("canvas");
      out.className = "sticker";
      out.width = Math.max(1, Math.round(nextW * dpr));
      out.height = Math.max(1, Math.round(nextH * dpr));
      out.style.left = nextX + "px";
      out.style.top = nextY + "px";
      out.style.width = nextW + "px";
      out.style.height = nextH + "px";
      out.style.transform = c.style.transform;
      out.style.filter = c.style.filter;
      out.style.borderRadius = c.style.borderRadius;
      out.style.border = c.style.border;

      const ctx = out.getContext("2d");
      ctx.drawImage(c, (st.x - nextX) * dpr, (st.y - nextY) * dpr);

      c.replaceWith(out);
      st.el = out;
      st.x = nextX;
      st.y = nextY;
      st.w = nextW;
      st.h = nextH;
      st._sideFullscreenCanvas = true;

      attachStickerInteractions(st);
      if (selected === st) out.classList.add("selected");
    }

    function trimStickerCanvasToContent(st, marginCss = 2){
      if (!st?.el) return false;

      const c = st.el;
      const ctx = c.getContext("2d", { willReadFrequently: true });
      let img;
      try{
        img = ctx.getImageData(0, 0, c.width, c.height);
      }catch(err){
        console.warn("trim sticker failed:", err);
        return false;
      }

      const data = img.data;
      let left = c.width;
      let top = c.height;
      let right = -1;
      let bottom = -1;

      for (let y = 0; y < c.height; y++){
        for (let x = 0; x < c.width; x++){
          const a = data[(y * c.width + x) * 4 + 3];
          if (a <= 2) continue;
          if (x < left) left = x;
          if (x > right) right = x;
          if (y < top) top = y;
          if (y > bottom) bottom = y;
        }
      }

      if (right < left || bottom < top) return false;

      const cssPerPxX = st.w / c.width;
      const cssPerPxY = st.h / c.height;
      const marginPxX = Math.ceil(marginCss / cssPerPxX);
      const marginPxY = Math.ceil(marginCss / cssPerPxY);
      left = Math.max(0, left - marginPxX);
      top = Math.max(0, top - marginPxY);
      right = Math.min(c.width - 1, right + marginPxX);
      bottom = Math.min(c.height - 1, bottom + marginPxY);

      const cropW = right - left + 1;
      const cropH = bottom - top + 1;
      if (cropW === c.width && cropH === c.height) return false;

      const out = document.createElement("canvas");
      out.className = "sticker";
      out.width = cropW;
      out.height = cropH;
      out.style.left = (st.x + left * cssPerPxX) + "px";
      out.style.top = (st.y + top * cssPerPxY) + "px";
      out.style.width = (cropW * cssPerPxX) + "px";
      out.style.height = (cropH * cssPerPxY) + "px";
      out.style.transform = c.style.transform;
      out.style.filter = c.style.filter;
      out.style.borderRadius = c.style.borderRadius;
      out.style.border = c.style.border;

      out.getContext("2d").drawImage(c, left, top, cropW, cropH, 0, 0, cropW, cropH);

      c.replaceWith(out);
      st.el = out;
      st.x += left * cssPerPxX;
      st.y += top * cssPerPxY;
      st.w = cropW * cssPerPxX;
      st.h = cropH * cssPerPxY;
      st._sideFullscreenCanvas = false;

      attachStickerInteractions(st);
      if (selected === st) out.classList.add("selected");
      return true;
    }

    function finishSideCanvasSize(st){
      if (!st?._sideFullscreenCanvas) return;
      trimStickerCanvasToContent(st, 2);
    }

function applySideExtrude(thickness=18, dx=1, dy=1, darken=0.35, isPreview=false){
  if (!selected) return;

  // 只有“正式 apply”才入 undo
  if (!isPreview){
    if (!pushUndoForSelected()) return;
  }

  const c = selected.el;
  const w = c.width, h = c.height;

  const base = document.createElement("canvas");
  base.width = w; base.height = h;
  base.getContext("2d").drawImage(c, 0, 0);

  const edgeCol = getEdgeAverageColor(base);

  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,w,h);

  for (let i = thickness; i >= 1; i--){
    const ox = i * dx;
    const oy = i * dy;

    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(base, ox, oy);

    ctx.globalCompositeOperation = "destination-out";
    ctx.drawImage(base, 0, 0);

    const t = i / thickness;
    
    //平均色
    //ctx.globalCompositeOperation = "source-atop";
    //ctx.fillStyle = `rgba(${edgeCol.r},${edgeCol.g},${edgeCol.b},${0.20 + 0.30*t})`;
    //ctx.fillRect(ox, oy, w, h);

    if (darken > 0){
      ctx.globalCompositeOperation = "source-atop";
    //ctx.fillStyle = `rgba(0,0,0,${darken * (0.06 + 0.18*t)})`;
      
      ctx.fillStyle = `rgba(0,0,0,${(darken / thickness) * (0.06 + 0.18*t)})`;
      ctx.fillRect(ox, oy, w, h);
    }

    ctx.restore();
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(base, 0, 0);

  selected.sideOn = true;
  applyStickerCssFilter(selected);
}

    stage.addEventListener("touchstart", (e)=>{
      if (!selected) return;
      if (e.touches.length === 2){
        e.preventDefault();
        const t1 = e.touches[0], t2 = e.touches[1];
        const dx = t2.clientX - t1.clientX;
        const dy = t2.clientY - t1.clientY;
        gesture.active = true;
        gesture.startDist = Math.hypot(dx,dy);
        gesture.startAng  = Math.atan2(dy,dx);
        gesture.baseScale = selected.scale;
        gesture.baseRot   = selected.rot;
      }
    }, { passive:false });

    stage.addEventListener("touchmove", (e)=>{
      if (!gesture.active || !selected) return;
      if (e.touches.length !== 2) return;
      e.preventDefault();

      const t1 = e.touches[0], t2 = e.touches[1];
      const dx = t2.clientX - t1.clientX;
      const dy = t2.clientY - t1.clientY;

      const dist = Math.hypot(dx,dy);
      const ang  = Math.atan2(dy,dx);

      const scale = gesture.baseScale * (dist / Math.max(1, gesture.startDist));
      const rot   = gesture.baseRot + (ang - gesture.startAng);

      selected.scale = clamp(scale, 0.2, 6);
      selected.rot = rot;
      applyTransform(selected);
    }, { passive:false });

    stage.addEventListener("touchend", ()=>{ gesture.active = false; });
    stage.addEventListener("touchcancel", ()=>{ gesture.active = false; });

    // ✅ tap 判定：避免轻微移动造成混乱
    let stageTap = { down:false, x:0, y:0, id:null };
    const TAP_MOVE_THRESHOLD = 10;
    const BLANK_DOUBLE_TAP_MS = 320;
    const BLANK_DOUBLE_TAP_DISTANCE = 28;
    let lastBlankTap = { time:0, x:0, y:0 };
    let blankTapTimer = 0;

    function makeTapLikeEvent(e){
      return {
        clientX: e.clientX,
        clientY: e.clientY,
        type: e.type,
        preventDefault(){},
        stopPropagation(){}
      };
    }

    function handleBlankTap(e, sourceTap = null){
      const now = performance.now();
      const closeInTime = now - lastBlankTap.time <= BLANK_DOUBLE_TAP_MS;
      const closeInSpace = Math.hypot(e.clientX - lastBlankTap.x, e.clientY - lastBlankTap.y) <= BLANK_DOUBLE_TAP_DISTANCE;
      const isDoubleTap = closeInTime && closeInSpace;

      if (isDoubleTap){
        clearTimeout(blankTapTimer);
        blankTapTimer = 0;
        lastBlankTap = { time:0, x:0, y:0 };
        showCaptureTour(e.clientX, e.clientY);
        completeGuideStep("capture");
        return;
      }

      lastBlankTap = { time:now, x:e.clientX, y:e.clientY };
      clearTimeout(blankTapTimer);
      blankTapTimer = setTimeout(async ()=>{
        blankTapTimer = 0;
        if (captureMode === "mp" && sourceTap){
          await handleMediaPipeTap(sourceTap);
        }
      }, BLANK_DOUBLE_TAP_MS + 20);
    }

    stage.addEventListener("pointerdown", (e)=>{
    if (e.target.closest("#sidebar")) return; 
      if (
        e.target.closest(".topbar") ||
        e.target.closest("#editbar") ||
        e.target.closest("#gridbar") ||  
        e.target.closest("#libPanelWrap")
      ) return;

      if (!video.srcObject) { showHint("Click Start Camera first", 900); return; }

      if (e.target.closest(".sticker")) return;

      if (editbar.style.display === "flex") {
        editbar.style.display = "none";
        showHint("exit Edit", 800);
        return;
      }
      // ---- MAGNET MODE (v2: hand-draw) ----
      if (captureMode === "magnet"){
        e.preventDefault();

        fieldDrawing = true;
        fieldPts = [];

        const p = localPointFromClient(e.clientX, e.clientY);
        fieldPts.push({ x:p.x, y:p.y });

        // 先画一个 draft
        const kind = magnetShape;
        drawFieldOverlay(fieldPts, kind, magnetBind.toUpperCase());
        return;
      }
      stageTap.down = true;
      stageTap.x = e.clientX;
      stageTap.y = e.clientY;
      stageTap.id = e.pointerId;

      if (captureMode === "rect" || captureMode === "draw" || captureMode === "grid"){
        e.preventDefault();
        pointerDown = true;

        const p = localPointFromClient(e.clientX, e.clientY);
        startPt = p;

        roi = { x:p.x, y:p.y, w:1, h:1 };
        path = [ {x:p.x, y:p.y} ];

        showROI(roi);
        if (captureMode === "draw") drawPathPreview(path);
      }
    }, { passive:false });

    stage.addEventListener("pointermove", (e)=>{
      // ---- MAGNET MODE DRAW (v2) ----
      if (captureMode === "magnet" && fieldDrawing){
        e.preventDefault();

        const p = localPointFromClient(e.clientX, e.clientY);
        const last = fieldPts[fieldPts.length - 1];

        // 采样间隔：防止点太密
        if (!last || Math.hypot(p.x-last.x, p.y-last.y) > 3){
          fieldPts.push({ x:p.x, y:p.y });
        }

      const kind = magnetShape;
      drawFieldOverlay(fieldPts, kind, magnetBind.toUpperCase());
        return;
      }
      if (!pointerDown || !startPt) return;
      e.preventDefault();

      const p = localPointFromClient(e.clientX, e.clientY);

      if (captureMode === "rect" || captureMode === "grid"){
        const x = Math.min(startPt.x, p.x);
        const y = Math.min(startPt.y, p.y);
        const w = Math.abs(p.x - startPt.x);
        const h = Math.abs(p.y - startPt.y);
        roi = {
          x: clamp(x, 0, startPt.W-1),
          y: clamp(y, 0, startPt.H-1),
          w: clamp(w, 1, startPt.W),
          h: clamp(h, 1, startPt.H)
        };
        showROI(roi);
      } else if (captureMode === "draw"){
        path.push({x:p.x, y:p.y});
        let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
        for (const pt of path){
          minX = Math.min(minX, pt.x); minY = Math.min(minY, pt.y);
          maxX = Math.max(maxX, pt.x); maxY = Math.max(maxY, pt.y);
        }
        roi = { x:minX, y:minY, w:(maxX-minX), h:(maxY-minY) };
        showROI(roi);
        drawPathPreview(path);
      }
    }, { passive:false });

    stage.addEventListener("pointerup", async (e)=>{
      // ✅ MP/none：pointerup 做 tap 判定；none 只保留双击 Capture Tour，不触发分割
      if (captureMode === "mp" || captureMode === "none"){
        if (stageTap.down && e.pointerId === stageTap.id){
          const dx = e.clientX - stageTap.x;
          const dy = e.clientY - stageTap.y;
          const moved = Math.hypot(dx,dy) > TAP_MOVE_THRESHOLD;
          const sourceTap = captureMode === "mp" ? makeTapLikeEvent(e) : null;
          stageTap.down = false;

          if (!moved){
            handleBlankTap(e, sourceTap);
          }
        }
        return;
      }

      // ---- MAGNET MODE APPLY (v2: create field + docks) ----
      if (captureMode === "magnet"){
        if (!fieldDrawing) return;
        e.preventDefault();
        fieldDrawing = false;

        // 点太少：取消
        if (fieldPts.length < 8){
          fieldPts = [];
          clearFieldOverlay();
          showHint("too short", 700);
          return;
        }

        const kind = magnetShape;
        const bind = magnetBind;

        // LOOP：强制闭合（把起点补到末尾）
        if (kind === "loop"){
          const a = fieldPts[0], b = fieldPts[fieldPts.length - 1];
          if (Math.hypot(a.x-b.x, a.y-b.y) > 10){
            fieldPts.push({ x:a.x, y:a.y });
          }
        }

        field = {
          kind,
          bind,
          pts: fieldPts.slice(),
          docks: new Map(),
          strength: 980,
          swirl: 2.4,
          damping: 0.86
        };

        // ✅ 强绑定：给每个 sticker 分配 dock 点（严格 in/out/on）
        assignDocksForField();

        // ✅ 场持久显示：保留在 magnetPreview 上
        drawFieldOverlay(field.pts, field.kind, magnetBind.toUpperCase());

        // ✅ 即使 Gravity OFF，也要让它动起来
        startGravityLoop();

        showHint(kind === "loop" ? ("FIELD " + magnetBind.toUpperCase()) : "FIELD ON PATH", 900);
        return;
      }

      // RECT/DRAW：原逻辑
      if (!pointerDown) return;
      e.preventDefault();
      pointerDown = false;

      if (!roi || roi.w < 8 || roi.h < 8){
        hideROI();
        roi = null; path = []; startPt = null;
        clearPathPreview();
        const dx = e.clientX - stageTap.x;
        const dy = e.clientY - stageTap.y;
        if (stageTap.down && e.pointerId === stageTap.id && Math.hypot(dx, dy) <= TAP_MOVE_THRESHOLD){
          stageTap.down = false;
          handleBlankTap(e);
        }
        return;
      }

    if (captureMode === "grid"){
      pendingGridRect = { ...roi };
      gridbar.style.display = "flex";
      syncControlLabelVisibility(gridbar);
      updateCircularControls();
      positionGridControlsNearPendingRect();

      showRoiGridPreview(true);
      updateRoiGridPreview();

      console.log("GRID branch fired. display =", getComputedStyle(gridbar).display);


      showHint("Click done after setting rows/columns", 900);
      // GRID 这里先不 hideROI，让你看到外框
    } else if (captureMode === "rect"){
      await createStickerFromROI(roi, null);
      hideROI();
    } else if (captureMode === "draw"){
      await createStickerFromROI(roi, (path.length>=2 ? path : null));
      hideROI();
    }


    stageTap.down = false;
    if (captureMode !== "grid"){
      roi = null; path = []; startPt = null;
      clearPathPreview();
    } else {
      // GRID：保留 roiBox 外框，等 done/cancel
      roi = null; path = []; startPt = null;
      clearPathPreview();
    }

    }, { passive:false });

    stage.addEventListener("pointercancel", ()=>{
      stageTap.down = false;
      pointerDown = false;
      hideROI();
      roi = null; path = []; startPt = null;
      clearPathPreview();
    });

    async function createStickerFromROI(rect, pathPoints){
      const crop = cssRectToVideoCrop(rect);
      if (!crop) return;

      const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
      const src = document.createElement("canvas");
      src.width  = Math.round(rect.w * dpr);
      src.height = Math.round(rect.h * dpr);
      const ctx = src.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.clearRect(0,0,src.width, src.height);

      if (pathPoints && pathPoints.length >= 2){
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.beginPath();
        ctx.moveTo(pathPoints[0].x - rect.x, pathPoints[0].y - rect.y);
        for (const p of pathPoints) ctx.lineTo(p.x - rect.x, p.y - rect.y);
        ctx.closePath();
        ctx.clip();

        const frameCanvas = getVideoFrameCanvas();
        if (!frameCanvas){ showHint("Video not ready", 900); return; }
        ctx.drawImage(frameCanvas, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, rect.w, rect.h);
        ctx.restore();
      } else {
        const frameCanvas = getVideoFrameCanvas();
        if (!frameCanvas){ showHint("Video not ready", 900); return; }
        ctx.drawImage(frameCanvas, crop.sx, crop.sy, crop.sw, crop.sh, 0, 0, src.width, src.height);
      }

      addStickerFromCanvas(src, rect);
      showHint("done", 1200);
    }

    async function createGridFromROI(rect, rows, cols){
  const crop = cssRectToVideoCrop(rect);
  if (!crop) return;

  // 用视频真实像素裁切（最稳）
  const frameCanvas = getVideoFrameCanvas();
  if (!frameCanvas){
    showHint("Video not ready", 900);
    return;
  }

  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));

  // 先把“大框”整块画出来（像你 rect 截取那样）
  const big = document.createElement("canvas");
  big.width  = Math.round(rect.w * dpr);
  big.height = Math.round(rect.h * dpr);

  const bctx = big.getContext("2d");
  bctx.imageSmoothingEnabled = true;
  bctx.clearRect(0,0,big.width,big.height);

  // 从 frameCanvas 上裁切 crop（crop 是视频像素坐标）
  // frameCanvas 的尺寸就是 video.videoWidth/Height
  bctx.drawImage(
    frameCanvas,
    crop.sx, crop.sy, crop.sw, crop.sh,
    0, 0, big.width, big.height
  );

  // 计算每个 cell 的 css 尺寸
  const cellW = rect.w / cols;
  const cellH = rect.h / rows;

  // 每个 cell 在 big canvas 上的像素尺寸
  const cellPW = big.width / cols;
  const cellPH = big.height / rows;

  const gid = "grid_" + (gridGroupSeq++);
  const group = {
    id: gid,
    rect: { ...rect },
    rows, cols,
    cells: [],          // 每个 cell 的“槽位”坐标
    pieces: []          // sticker 对象引用
  };

  // 预先算好每个槽位的位置
  for (let r=0; r<rows; r++){
    for (let c=0; c<cols; c++){
      group.cells.push({
        x: rect.x + c * cellW,
        y: rect.y + r * cellH,
        w: cellW,
        h: cellH
      });
    }
  }

  // 生成碎片
  for (let r=0; r<rows; r++){
    for (let c=0; c<cols; c++){
      const src = document.createElement("canvas");
      src.width = Math.max(1, Math.round(cellPW));
      src.height = Math.max(1, Math.round(cellPH));
      const sctx = src.getContext("2d");
      sctx.clearRect(0,0,src.width,src.height);

      // 从 big canvas 上切片
      sctx.drawImage(
        big,
        c * cellPW, r * cellPH, cellPW, cellPH,
        0, 0, src.width, src.height
      );

      // 放置到对应格子槽位（css 坐标）
      const slot = group.cells[r*cols + c];
      addStickerFromCanvas(src, { x: slot.x, y: slot.y, w: slot.w, h: slot.h });

      // 取到刚刚 push 的最后一个 sticker
      const st = stickers[stickers.length - 1];
      st.groupId = gid;
      st.slotIndex = r*cols + c;
      st.inGrid = true;

      // 让碎片“像拼图一样更像网格”
      st.el.style.borderRadius = "0px";

      group.pieces.push(st);
    }
  }

  gridGroups.push(group);
  showHint(`GRID done (${rows}×${cols})，shake to shuffle`, 1400);
}

    // ✅ MP：永远保留你点到的物体（自动判断需不需要反转）
    // =========================
    async function handleMediaPipeTap(e){
    e.preventDefault?.();
    if (!interactiveSegmenter) { showHint("Model not ready", 800); return; }
    if (isProcessing) return;

    const vRect = video.getBoundingClientRect();
    const { cx: clientX, cy: clientY } = getClientXY(e);
    if (clientX == null || clientY == null) return;

    console.log("tap event", e.type, "client", clientX, clientY);
    console.log("video ready", video.videoWidth, video.videoHeight, "seg", !!interactiveSegmenter);

    // 点击必须落在视频可视区域内
    if (clientX < vRect.left || clientX > vRect.right || clientY < vRect.top || clientY > vRect.bottom) return;

    isProcessing = true;
    try{
    // 点击点在 video DOM（object-fit:cover 的可视区域）内的归一化坐标
    const relativeX = (clientX - vRect.left) / vRect.width;
    const relativeY = (clientY - vRect.top) / vRect.height;
    console.log("relative", relativeX, relativeY);

    const result = await new Promise(resolve => {
    const frameCanvas = getVideoFrameCanvas();
    if (!frameCanvas){
    showHint("Video not ready (wait for camera feed)", 900);
    isProcessing = false;
    return;
    }

    interactiveSegmenter.segment(
    frameCanvas,
    { keypoint: { x: relativeX, y: relativeY } },
    (r)=>resolve(r)
    );

    });

    if (!result?.categoryMask){
      showHint("No mask obtained (try another point)", 900);
      isProcessing = false;
      return;
    }

    // ✅ 使用视频“真实像素尺寸”，不是屏幕尺寸
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    // 把当前帧画到 fullCanvas 上（与 mask 同分辨率）
    const fullCanvas = document.createElement("canvas");
    fullCanvas.width = vw;
    fullCanvas.height = vh;
    const fctx = fullCanvas.getContext("2d", { willReadFrequently: true });
    fctx.drawImage(video, 0, 0, vw, vh);

    // 读像素
    const frameData = fctx.getImageData(0, 0, vw, vh);
    const rgba = frameData.data;

    // 读 mask
    const maskData = result.categoryMask.getAsFloat32Array();

    // ✅ 判断 mask 类型：有些设备给 0/1（像 uint8），有些给 0~1（float）
    let isUintMask = true;
    for (let k = 0; k < 40 && k < maskData.length; k++){
      const v = maskData[k];
      if (v !== 0 && v !== 1) { isUintMask = false; break; }
    }

    const TH = 0.4;

    const isMasked = (idx) => {
      const v = maskData[idx];
      return isUintMask ? (v > 0) : (v >= TH);
    };

    // ✅ 用“点击点”决定保留哪一类（前景/背景）
    const mx = Math.max(0, Math.min(vw - 1, Math.floor(relativeX * vw)));
    const my = Math.max(0, Math.min(vh - 1, Math.floor(relativeY * vh)));
    const mi = my * vw + mx;

    const clickedClass = isMasked(mi);
    console.log("mask clicked:", maskData[mi], "isUint:", isUintMask, "clickedClass:", clickedClass);

    // 只保留跟 clickedClass 相同的像素
    for (let i = 0; i < vw * vh; i++){
      if (isMasked(i) !== clickedClass) rgba[i*4 + 3] = 0;
    }
    fctx.putImageData(frameData, 0, 0);

    // trim 到非透明边界，得到“物体本体”canvas
    const trimmed = trimCanvas(fullCanvas);
    if (!trimmed){
      showHint("Segmented image is empty", 900);
      isProcessing = false;
      return;
    }

    // ✅ 把“视频像素坐标”映射回舞台（object-fit:cover）
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const videoAspect = vw / vh;
    const stageAspect = sw / sh;

    let drawW, drawH, offsetX, offsetY;
    if (stageAspect > videoAspect) {
      // stage wider: video width fills stage, top/bottom cropped
      drawW = sw;
      drawH = sw / videoAspect;
      offsetX = 0;
      offsetY = (sh - drawH) / 2;
    } else {
      // stage taller: video height fills stage, left/right cropped
      drawH = sh;
      drawW = sh * videoAspect;
      offsetY = 0;
      offsetX = (sw - drawW) / 2;
    }

    let nx = Number(trimmed.dataset.originX) / vw;
    const ny = Number(trimmed.dataset.originY) / vh;
    const nw = trimmed.width / vw;
    const nh = trimmed.height / vh;

    // 前置镜像要反过来
    if (facingMode === "user"){
      nx = 1 - nx - nw;
    }

    const cssRect = {
      x: offsetX + nx * drawW,
      y: offsetY + ny * drawH,
      w: nw * drawW,
      h: nh * drawH
    };

    addStickerFromCanvas(trimmed, cssRect);
    showHint("done", 1300);

  } catch(err){
    console.error(err);
    showHint("Error occurred while segmenting (network/model/permission issues)", 1200);
  }
  isProcessing = false;
}


    function trimCanvas(c){
      const ctx = c.getContext("2d");
      const pixels = ctx.getImageData(0,0,c.width,c.height);
      const l = pixels.data.length;
      let bound = { top:null, left:null, right:null, bottom:null };
      let x,y;

      for (let i=0;i<l;i+=4){
        if (pixels.data[i+3] !== 0){
          x = (i/4) % c.width;
          y = ~~((i/4) / c.width);
          if (bound.top === null) bound.top = y;
          if (bound.left === null) bound.left = x;
          else if (x < bound.left) bound.left = x;

          if (bound.right === null) bound.right = x;
          else if (bound.right < x) bound.right = x;

          if (bound.bottom === null) bound.bottom = y;
          else if (bound.bottom < y) bound.bottom = y;
        }
      }
      if (bound.top === null) return null;

      const trimW = bound.right - bound.left + 1;
      const trimH = bound.bottom - bound.top + 1;

      const out = document.createElement("canvas");
      out.width = trimW;
      out.height = trimH;
      out.getContext("2d").drawImage(c, bound.left, bound.top, trimW, trimH, 0,0, trimW, trimH);

      out.dataset.originX = bound.left;
      out.dataset.originY = bound.top;
      return out;
    }

    async function imageUrlToLocalDataURL(url){
      if (String(url).startsWith("data:")) return url;

      const res = await fetch(url, { mode: "cors", cache: "force-cache" });
      if (!res.ok) throw new Error("image fetch failed");

      const blob = await res.blob();
      return await new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function addStickerFromDataURL(dataURL, w, h){
      const localDataURL = await imageUrlToLocalDataURL(dataURL).catch((err)=>{
        console.warn("image localize failed, falling back to original url:", err);
        return dataURL;
      });

      const img = new Image();
      if (!String(localDataURL).startsWith("data:")) img.crossOrigin = "anonymous";
      img.src = localDataURL;
      await img.decode().catch(()=>{});

      const rect = stage.getBoundingClientRect();
      const targetW = clamp(w || 160, 60, rect.width * 0.8);
      const targetH = clamp(h || 120, 60, rect.height* 0.8);

      const x = (rect.width - targetW)/2;
      const y = (rect.height - targetH)/2;

      const src = document.createElement("canvas");
      src.width = img.naturalWidth || 512;
      src.height = img.naturalHeight || 512;
      const ctx = src.getContext("2d");
      ctx.drawImage(img, 0,0, src.width, src.height);

      try{
        ctx.getImageData(0, 0, 1, 1);
      }catch(err){
        console.warn("library sticker canvas is tainted; undo pixel edits may not work:", err);
        showHint("Cannot prepare undo for this library image", 1200);
      }

      addStickerFromCanvas(src, { x, y, w: targetW, h: targetH });
      showHint("Placed back", 900);
    }

    async function addStickerFromProjectItem(item){
      const localDataURL = await imageUrlToLocalDataURL(item.dataURL).catch(()=>item.dataURL);
      const img = new Image();
      if (!String(localDataURL).startsWith("data:")) img.crossOrigin = "anonymous";
      img.src = localDataURL;
      await img.decode().catch(()=>{});

      const src = document.createElement("canvas");
      src.width = img.naturalWidth || Math.max(1, Math.round(item.w || 160));
      src.height = img.naturalHeight || Math.max(1, Math.round(item.h || 120));
      src.getContext("2d").drawImage(img, 0, 0, src.width, src.height);

      const st = addStickerFromCanvas(src, {
        x: item.x || 0,
        y: item.y || 0,
        w: item.w || 160,
        h: item.h || 120
      });
      st.scale = item.scale || 1;
      st.rot = item.rot || 0;
      st.blurPx = item.blurPx || 0;
      st.sideOn = !!item.sideOn;
      applyTransform(st);
      applyStickerCssFilter(st);
      return st;
    }

    function stickerToDataURL(st){
      return st.el.toDataURL("image/png");
    }

function positionGlobalActionButtonsForViewport(){
  const globalActionButtons = document.getElementById("globalActionButtons");
  const globalGroup = document.getElementById("globalGroup");
  const buttons = [
    document.getElementById("btnDeleteSelected"),
    document.getElementById("btnDoneGlobal"),
    document.getElementById("btnClearAll"),
    document.getElementById("btnUndoGlobal"),
    document.getElementById("btnRedoGlobal")
  ].filter(Boolean);

  if (!globalActionButtons || !globalGroup || buttons.length === 0) return null;

  if (isPhoneLayout()){
    globalActionButtons.style.top = "";
    globalActionButtons.style.bottom = "";
    return null;
  }

  const groupRect = globalGroup.getBoundingClientRect();
  const topMargin = Math.max(0, Math.round(groupRect.top || 26));

  globalActionButtons.style.top = "auto";
  globalActionButtons.style.bottom = `${topMargin}px`;

  const columnRect = globalActionButtons.getBoundingClientRect();

  const tops = new Map();
  let y = columnRect.top;
  buttons.forEach(btn=>{
    tops.set(btn.id, y);
    y += btn.offsetHeight || 24;
  });

  return {
    top: columnRect.top,
    bottom: columnRect.bottom,
    tops
  };
}

function positionLibraryPanelUnderTrigger(){
  if (!libPanelWrap) return;
  const actionLayout = positionGlobalActionButtonsForViewport();
  const stickerBtn = document.getElementById("btnLibrary");
  const target = stickerBtn?.querySelector?.("img") || stickerBtn;
  const rect = target?.getBoundingClientRect?.();
  if (!rect) return;

  const redoTarget = document.getElementById("btnRedoGlobal");
  const redoRect = redoTarget?.getBoundingClientRect?.();
  const viewportH = window.visualViewport?.height || window.innerHeight;
  const fallbackBottom = viewportH - 18;

  if (!isPhoneLayout()){
    const tabletTop = Math.round(rect.bottom + 6);
    const tabletBottom = Math.round(actionLayout?.bottom || redoRect?.bottom || fallbackBottom);
    const tabletHeight = Math.min(
      Math.max(180, tabletBottom - tabletTop),
      Math.max(180, viewportH - tabletTop - 14)
    );
    libPanelWrap.style.top = `${tabletTop}px`;
    libPanelWrap.style.height = `${tabletHeight}px`;
    libPanelWrap.style.maxHeight = `${tabletHeight}px`;
    return;
  }

  const top = Math.round(rect.bottom + 6);
  const bottom = Math.max(top + 220, Math.round((redoRect?.bottom || fallbackBottom)));
  const height = Math.max(220, bottom - top);

  libPanelWrap.style.top = `${top}px`;
  libPanelWrap.style.height = `${height}px`;
  libPanelWrap.style.maxHeight = `${height}px`;
}

function showGuideStep(step){
  if (!isPhoneLayout()){
    clearGuideOverlay();
    guideStep = "done";
    return;
  }
  clearGuideOverlay();
  guideStep = step;
  if (!step || step === "done") return;

  const overlay = document.createElement("div");
  overlay.id = "guideOverlay";
  if (step === "startCamera"){
    overlay.innerHTML = `
      <div class="guideDot startCameraTap"></div>
      <div class="guideText startCamera">Tap Start Camera to begin.</div>
    `;
  } else if (step === "leftClose"){
    overlay.innerHTML = `
      <div class="guideArrow left">&#8592;</div>
      <div class="guideText leftClose">Swipe left to close Global Functions.</div>
    `;
  } else if (step === "rightOpen"){
    overlay.innerHTML = `
      <div class="guideArrow right openRight">&#8592;</div>
      <div class="guideText right rightSwipe">Swipe left from the right edge to open the function.</div>
    `;
  } else if (step === "rightClose"){
    overlay.innerHTML = `
      <div class="guideArrow right">&#8594;</div>
      <div class="guideText right rightSwipe">Swipe right to close.</div>
    `;
  } else if (step === "capture"){
    overlay.innerHTML = `
      <div class="guideDot"></div>
      <div class="guideText capture">Double-tap a blank area of the video to open Capture Function, then rotate to choose.</div>
    `;
  }
  document.body.appendChild(overlay);
  guideOverlay = overlay;

  if (step === "startCamera"){
    const positionStartCameraGuide = (positionGuide = true)=>{
      if (!overlay.isConnected || guideStep !== "startCamera") return;
      const guide = overlay.querySelector(".guideText.startCamera");
      const tapDot = overlay.querySelector(".guideDot.startCameraTap");
      const startTarget = document.querySelector("#btnStart img") || document.getElementById("btnStart");
      const rect = startTarget?.getBoundingClientRect?.();
      if (!guide || !rect) return;
      const startGuideOffsetX = 90;
      const startGuideOffsetY = 34;
      const startGuideVisualNudgeX = 36;
      const maxLeft = window.innerWidth - guide.offsetWidth - 10;
      if (positionGuide){
        guide.style.left = `${Math.max(74, Math.min(maxLeft, rect.right + startGuideOffsetX))}px`;
        guide.style.top = `${Math.max(8, rect.top + rect.height / 2 - guide.offsetHeight / 2 + startGuideOffsetY)}px`;
        guide.style.transform = `translateX(${startGuideVisualNudgeX}px)`;
      }
      if (tapDot){
        tapDot.style.left = `${rect.left + rect.width / 2 + 17}px`;
        tapDot.style.top = `${Math.max(12, rect.top + 6)}px`;
      }
    };
    requestAnimationFrame(positionStartCameraGuide);
    setTimeout(()=>positionStartCameraGuide(false), 360);
  } else if (step === "leftClose" || step === "rightOpen" || step === "rightClose"){
    requestAnimationFrame(()=>{
      const arrow = overlay.querySelector(".guideArrow");
      const guide = overlay.querySelector(".guideText");
      const target = step === "leftClose"
        ? (document.querySelector("#btnFlip img") || document.getElementById("btnFlip"))
        : (document.querySelector("#captureGroup > .foldBtn img") || document.getElementById("captureGroup"));
      const rect = target?.getBoundingClientRect?.();
      if (!arrow || !rect) return;
      const rightGuideOffsetY = step === "rightOpen" || step === "rightClose" ? 30 : 0;
      const centerY = rect.top + rect.height / 2 + rightGuideOffsetY;
      arrow.style.top = `${Math.max(8, centerY - arrow.offsetHeight / 2)}px`;
      if (step === "leftClose"){
        arrow.style.left = `${rect.right + 12}px`;
        arrow.style.right = "auto";
        if (guide){
          guide.style.left = `${rect.right + 72}px`;
          guide.style.right = "auto";
        }
      } else {
        arrow.style.right = `${Math.max(8, window.innerWidth - rect.left + 12)}px`;
        arrow.style.left = "auto";
        if (guide && step === "rightClose"){
          const rightCloseGuideNudgeX = 134;
          guide.style.transform = `translateX(-${rightCloseGuideNudgeX}px)`;
          requestAnimationFrame(()=>{
            const guideRect = guide.getBoundingClientRect();
            arrow.style.display = "block";
            arrow.style.left = `${guideRect.right + 10}px`;
            arrow.style.right = "auto";
          });
        }
      }
      if (guide){
        guide.style.top = `${Math.max(8, centerY - guide.offsetHeight / 2)}px`;
      }
    });
  }
}

function queueGuideStep(step, delay){
  guideStep = step;
  setTimeout(()=>{
    if (guideStep === step) showGuideStep(step);
  }, delay);
}

function completeGuideStep(step){
  if (guideStep !== step) return;
  clearGuideOverlay();
  if (step === "startCamera"){
    queueGuideStep("leftClose", 420);
  } else if (step === "leftClose"){
    queueGuideStep("rightOpen", 420);
  } else if (step === "rightOpen"){
    queueGuideStep("rightClose", 420);
  } else if (step === "rightClose"){
    queueGuideStep("capture", 520);
  } else if (step === "capture"){
    guideStep = "done";
  }
}

function setupHorizontalToolDrawer({ handle, panel, isOpen, setOpen, openDirection }){
  if (!handle) return;
  let drag = null;
  let suppressClick = false;
  const threshold = 54;
  const activeThreshold = 12;

  function begin(e){
    drag = {
      id:e.pointerId,
      startX:e.clientX,
      startY:e.clientY,
      active:false,
      captured:false,
      open:isOpen()
    };
    if (e.currentTarget === handle){
      e.currentTarget.setPointerCapture?.(e.pointerId);
      drag.captured = true;
      e.preventDefault();
    }
  }

  function move(e){
    if (!drag || drag.id !== e.pointerId) return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    if (!drag.active && Math.abs(dx) > activeThreshold && Math.abs(dx) > Math.abs(dy) * 1.2){
      drag.active = true;
    }
    if (drag.active){
      if (!drag.captured){
        e.currentTarget.setPointerCapture?.(e.pointerId);
        drag.captured = true;
      }
      e.preventDefault();
      e.stopPropagation();
    }
  }

  function end(e){
    if (!drag || drag.id !== e.pointerId) return;
    const dx = e.clientX - drag.startX;
    const wasActive = drag.active;
    const opened = drag.open
      ? !(dx * openDirection < -threshold)
      : (dx * openDirection > threshold);
    drag = null;
    if (wasActive || e.currentTarget === handle){
      setOpen(opened);
      suppressClick = wasActive;
      e.preventDefault();
      e.stopPropagation();
    }
  }

  function cancel(){
    drag = null;
  }

  [handle, panel].filter(Boolean).forEach(el=>{
    el.addEventListener("pointerdown", begin, { passive:false, capture:true });
    el.addEventListener("pointermove", move, { passive:false, capture:true });
    el.addEventListener("pointerup", end, { passive:false, capture:true });
    el.addEventListener("pointercancel", cancel, { passive:true, capture:true });
    el.addEventListener("click", (e)=>{
      if (!suppressClick) return;
      suppressClick = false;
      e.preventDefault();
      e.stopPropagation();
    }, true);
  });
}

    (function setupLibScrollbar(){
      const track = document.getElementById("libScrollTrack");
      const thumb = document.getElementById("libScrollThumb");
      if (!track || !thumb || !libPanel) return;

      function updateThumb(){
        const sH = libPanel.scrollHeight;
        const cH = libPanel.clientHeight;
        if (sH <= cH){
          thumb.style.display = "none";
          return;
        }
        thumb.style.display = "block";
        const trackH = track.clientHeight;
        const thumbH = thumb.offsetHeight;
        const maxScroll = sH - cH;
        const maxTop = Math.max(0, trackH - thumbH);
        const ratio = maxScroll > 0 ? libPanel.scrollTop / maxScroll : 0;
        const top = clamp(ratio * maxTop, 0, maxTop);
        thumb.style.top = top + "px";
      }

      libPanel.addEventListener("scroll", updateThumb);

      let dragging = false;
      let startY = 0;
      let startScroll = 0;
      thumb.addEventListener("pointerdown", (e)=>{
        dragging = true;
        startY = e.clientY;
        startScroll = libPanel.scrollTop;
        thumb.setPointerCapture(e.pointerId);
        e.preventDefault();
        e.stopPropagation();
      });
      thumb.addEventListener("pointermove", (e)=>{
        if (!dragging) return;
        const trackH = track.clientHeight;
        const thumbH = thumb.offsetHeight;
        const dy = e.clientY - startY;
        const sH = libPanel.scrollHeight;
        const cH = libPanel.clientHeight;
        const maxScroll = sH - cH;
        const maxTop = Math.max(1, trackH - thumbH);
        const scrollDelta = dy * maxScroll / maxTop;
        libPanel.scrollTop = clamp(startScroll + scrollDelta, 0, maxScroll);
      });
      thumb.addEventListener("pointerup", (e)=>{
        dragging = false;
        try { thumb.releasePointerCapture(e.pointerId); } catch {}
      });

      // observe panel size and content changes
      const ro = new ResizeObserver(updateThumb);
      ro.observe(libPanel);
      const mo = new MutationObserver(updateThumb);
      mo.observe(libPanel, { childList: true, subtree: true });
      window.addEventListener("resize", updateThumb);
      requestAnimationFrame(updateThumb);
    })();

function shuffleGridGroup(group){
  if (!group?.pieces?.length) return;

  // 随机打乱槽位 index
  const indices = group.cells.map((_, i)=>i);
  for (let i=indices.length-1; i>0; i--){
    const j = (Math.random() * (i+1)) | 0;
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }

  // 把每个 piece 移动到新的槽位，但外框不变
  group.pieces.forEach((st, k)=>{
    const slot = group.cells[indices[k]];
    st.x = slot.x;
    st.y = slot.y;

    st.el.style.transition = "left 180ms ease, top 180ms ease";
    st.el.style.left = st.x + "px";
    st.el.style.top  = st.y + "px";

    // 过一会儿取消 transition，避免影响你后续拖拽手感
    clearTimeout(st._t);
    st._t = setTimeout(()=>{ st.el.style.transition = ""; }, 220);
  });

  showHint("shuffle!", 700);
}

function shuffleAllGrids(){
  if (!gridGroups.length) return;

function shuffleAllStickers(swaps = 12){
  const n = stickers.length;
  if (n < 2) return;

  // 记录当前位置
  const pos = stickers.map(st => ({ x: st.x, y: st.y }));

  // 做若干次随机“成对交换”
  const times = Math.min(swaps, n * 2);
  for (let t=0; t<times; t++){
    const a = (Math.random() * n) | 0;
    let b = (Math.random() * n) | 0;
    if (b === a) b = (b + 1) % n;
    [pos[a], pos[b]] = [pos[b], pos[a]];
  }

  // 过渡动画（更像洗牌）
  stickers.forEach((st, i)=>{
    st.x = pos[i].x;
    st.y = pos[i].y;

    st.el.style.transition = "left 180ms ease, top 180ms ease";
    st.el.style.left = st.x + "px";
    st.el.style.top  = st.y + "px";

    clearTimeout(st._tShuffle);
    st._tShuffle = setTimeout(()=>{ st.el.style.transition = ""; }, 220);
  });

  showHint("shuffle!", 700);
}

let gravityMode = false;
let shuffleMode = false;

let shakeReady = false;
let tiltReady  = false;

let gravityRAF = 0;
let lastT = 0;

// tilt -> force vector（单位：px/s^2）
let tiltAX = 0; // right positive
let tiltAY = 0; // down positive

// iOS 上用 DeviceOrientation 取倾斜更稳定
function onDeviceOrientation(e){
  // gamma: 左右倾斜 [-90..90]，beta: 前后倾斜 [-180..180]
  const g = (typeof e.gamma === "number") ? e.gamma : 0;
  const b = (typeof e.beta  === "number") ? e.beta  : 0;

  // 归一化到 [-1..1]，并限制极端值
  const nx = clamp(g / 35, -1, 1); // 35°左右就满力
  const ny = clamp(b / 35, -1, 1);

  // 转成加速度（越大越“滑”）
  const A = 520; // px/s^2（温和：320~700）
  tiltAX = nx * A;
  tiltAY = ny * A;
}

function startGravityLoop(){
  if (gravityRAF) return;
  lastT = 0;
  gravityRAF = requestAnimationFrame(gravityTick);
}

function stopGravityLoop(){
  if (gravityRAF) cancelAnimationFrame(gravityRAF);
  gravityRAF = 0;
  lastT = 0;

  // 停止时把力归零，让它慢慢停住
  tiltAX = 0;
  tiltAY = 0;
}

function gravityTick(t){
  const dt = lastT ? Math.min(0.033, (t - lastT)/1000) : 0.016;
  lastT = t;

  const W = stage.clientWidth;
  const H = stage.clientHeight;

  // 阻尼 / 反弹（轻量不夸张）
  const linearDamp = 0.90;   // 越小越快停
  const angDamp    = 0.92;
  const bounce     = 0.58;   // 边缘反弹力度
  const maxV       = 1200;   // 速度上限，防止失控

  // 很轻的随机旋转（可关掉：把 jitter=0）
  const jitter = 0.25; // rad/s^2（越大越晃）
  
  for (const st of stickers){
    if (st._physLock || funcCircleOpen) continue;

    // 初始化（兼容旧 sticker）
    st.vx ??= 0; st.vy ??= 0; st.av ??= 0;

    // 1) 倾斜力 -> 速度
    st.vx += tiltAX * dt;
    st.vy += tiltAY * dt;

// 1.5) Field force（MAGNET v2: dock binding）
if (field){
  const dock = field.docks.get(st);
  if (dock){
    const cx = st.x + (st.w * st.scale)/2;
    const cy = st.y + (st.h * st.scale)/2;

    const tx = dock.x;
    const ty = dock.y;

    const dx = tx - cx;
    const dy = ty - cy;
    const d  = Math.hypot(dx,dy) || 1;

    // 越近越柔
    const pull = field.strength * (0.25 + 0.75 * clamp(d/420, 0, 1));

    // radial accel
    const ax = (dx/d) * pull;
    const ay = (dy/d) * pull;

    // swirl（切向）
    const sx = (-dy/d) * pull * field.swirl * 0.16;
    const sy = ( dx/d) * pull * field.swirl * 0.16;

    st.vx += (ax + sx) * dt;
    st.vy += (ay + sy) * dt;

    // 接近 dock 时角速度变小，避免乱抖
    st.av += clamp((sx+sy)/1200, -0.8, 0.8) * dt * clamp(d/240, 0, 1);

    // 阻尼：更容易停住
    st.vx *= field.damping;
    st.vy *= field.damping;

    if (d < 12){
      st.vx *= 0.55;
      st.vy *= 0.55;
    }
  }
}

    // 2) 轻微旋转趋势（速度越大越容易转一点点）
    const sp = Math.hypot(st.vx, st.vy);
    st.av += (Math.sign(st.vx)*0.15 + (Math.random()*2-1)*jitter) * dt * clamp(sp/800, 0, 1);

    // 3) integrate
    st.x += st.vx * dt;
    st.y += st.vy * dt;
    st.rot += st.av * dt;

    // 速度限制
    st.vx = clamp(st.vx, -maxV, maxV);
    st.vy = clamp(st.vy, -maxV, maxV);
    st.av = clamp(st.av, -3.0, 3.0);

    // 边界（用显示尺寸：w/h * scale）
    const w = st.w * st.scale;
    const h = st.h * st.scale;

    if (st.x < 0){ st.x = 0; st.vx = Math.abs(st.vx) * bounce; }
    if (st.y < 0){ st.y = 0; st.vy = Math.abs(st.vy) * bounce; }
    if (st.x + w > W){ st.x = Math.max(0, W - w); st.vx = -Math.abs(st.vx) * bounce; }
    if (st.y + h > H){ st.y = Math.max(0, H - h); st.vy = -Math.abs(st.vy) * bounce; }

    // 阻尼
    st.vx *= linearDamp;
    st.vy *= linearDamp;
    st.av *= angDamp;

    // 应用到 DOM
    st.el.style.left = st.x + "px";
    st.el.style.top  = st.y + "px";
    applyTransform(st);
  }

  // very light collision push（可选：想更省事可以删掉这一段）
  for (let i=0; i<stickers.length; i++){
    const a = stickers[i];
    if (a._physLock) continue;
    const aw = a.w * a.scale, ah = a.h * a.scale;
    const ax1 = a.x, ay1 = a.y, ax2 = a.x + aw, ay2 = a.y + ah;

    for (let j=i+1; j<stickers.length; j++){
      const b = stickers[j];
      if (b._physLock) continue;
      const bw = b.w * b.scale, bh = b.h * b.scale;
      const bx1 = b.x, by1 = b.y, bx2 = b.x + bw, by2 = b.y + bh;

      if (ax2 < bx1 || ax1 > bx2 || ay2 < by1 || ay1 > by2) continue;

      const overlapX = Math.min(ax2, bx2) - Math.max(ax1, bx1);
      const overlapY = Math.min(ay2, by2) - Math.max(ay1, by1);

      const push = 0.5; // 推开力度（0.3~0.8）
      if (overlapX < overlapY){
        const dir = (a.x + aw/2) < (b.x + bw/2) ? -1 : 1;
        const d = overlapX * push;
        a.x += dir * d;
        b.x -= dir * d;
        a.vx *= 0.96; b.vx *= 0.96;
      }else{
        const dir = (a.y + ah/2) < (b.y + bh/2) ? -1 : 1;
        const d = overlapY * push;
        a.y += dir * d;
        b.y -= dir * d;
        a.vy *= 0.96; b.vy *= 0.96;
      }

      a.el.style.left = a.x + "px";
      a.el.style.top  = a.y + "px";
      b.el.style.left = b.x + "px";
      b.el.style.top  = b.y + "px";
    }
  }

    const needLoop = gravityMode || !!field;
    if (needLoop){
      gravityRAF = requestAnimationFrame(gravityTick);
    }else{
      stopGravityLoop();
    }
}

// iOS / Android: devicemotion
let lastShakeAt = 0;
let shakeInstalled = false;
function installShake(){
  if (shakeInstalled) return;     // ✅ 防重复
  shakeInstalled = true;

  if (!("DeviceMotionEvent" in window)) return;

  const TH = 16;      // 阈值（可调：12~22）
  const GAP = 650;    // 防抖间隔

  window.addEventListener("devicemotion", (e)=>{
    //showHint("motion event!", 300);
    const now = Date.now();
    if (now - lastShakeAt < GAP) return;

    const a = e.accelerationIncludingGravity;
    if (!a) return;

    const mag = Math.sqrt((a.x||0)**2 + (a.y||0)**2 + (a.z||0)**2);
    if (mag > TH){
      lastShakeAt = now;

      // ✅ 1) Shuffle ON：洗全场
      if (shuffleMode){
        shuffleAllStickers(Math.max(8, Math.round(stickers.length * 0.6)));
        return;
      }

      // ✅ 2) Shuffle OFF：维持原逻辑（只洗 grid）
      shuffleAllGrids();
    }
  }, { passive:true });
}

    }catch{

    }
  }
}

function updateFloatingButtons() {
  const libPanelWrap = document.getElementById('libPanelWrap');

  const btnDone = document.getElementById('btnDoneGlobal');
  const btnClear = document.getElementById('btnClearAll');
  const btnUndo = document.getElementById('btnUndoGlobal');
  const btnRedo = document.getElementById('btnRedoGlobal');
  const globalGroup = document.getElementById('globalGroup');
