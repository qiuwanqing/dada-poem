    /*-----------------------分组折叠样式--------------------------*/
   .groupFold {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    }

    .groupContent {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0px;
        margin-top: 0px;

        overflow: hidden;
        max-height: 0;
        opacity: 0;
        transform: translateY(0) scaleY(1);
        transform-origin: top center;
        pointer-events: none;

        transition:
        max-height 0.34s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.20s ease,
        transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .groupFold.expanded .groupContent {
        max-height: 1000px;
        opacity: 1;
        transform: translateY(0) scaleY(1);
        pointer-events: auto;
    }

    .groupFold > .foldBtn img {
        transform-origin: center center;
        will-change: transform, filter;
    }

    .groupFold > .foldBtn:active img {
        transform: scale(0.98);
        filter: brightness(1.12);
    }

    .groupFold > .foldBtn.foldPulse img {
        animation: foldIconPop 220ms ease-out;
    }

    @keyframes foldIconPop {
        0%   { transform: scale(1); filter: brightness(1); }
        45%  { transform: scale(1.05); filter: brightness(1.16); }
        100% { transform: scale(1); filter: brightness(1); }
    }

    .subBtn.subPulse img {
        animation: subIconPop 180ms ease-out;
    }

    @keyframes subIconPop {
        0%   { transform: scale(1); filter: brightness(1); }
        45%  { transform: scale(1.04); filter: brightness(1.14); }
        100% { transform: scale(1); filter: brightness(1); }
    }

    .groupContent .subBtn img {
        opacity: 0;
        transform: translateY(-34px);
        transition:
          opacity 120ms linear,
          transform 220ms cubic-bezier(0.22, 0.72, 0.18, 1);
        transition-delay: calc(var(--drop-out-index, 0) * 24ms);
        will-change: transform, opacity;
    }

    .groupFold.expanded .groupContent .subBtn img {
        opacity: 1;
        transform: translateY(0);
        transition-delay: calc(var(--drop-index, 0) * 28ms);
    }

/* ---------------- global function---------------- */
    #globalGroup {
        position: absolute;
        left: 20px;    /* 新的 x 坐标 */
        top: 26px;    /* 新的 y 坐标 */
        width: auto;    /* 父容器自适应内容宽度 */

        z-index: 50;
    }

    #globalGroup .foldBtn {
    width: auto;           /* 不填满父容器，随内容自适应 */
    height: auto;
        padding: 0;
        border: none;
        background: none;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        cursor: pointer;
    }

    .globalIcon {
        width: auto;

    // grid groups
    let gridGroups = [];
    let gridGroupSeq = 1;

    // ============================== 新增折叠逻辑 ======
    document.querySelectorAll(".groupContent").forEach(content=>{
        const buttons = Array.from(content.querySelectorAll(".subBtn"));
        buttons.forEach((btn, i)=>{
            const index = buttons.length - 1 - i;
            btn.style.setProperty("--drop-index", index);

    [

    ].forEach(([id, inIndex, outIndex])=>{

        btn?.style.setProperty("--drop-index", inIndex);
        btn?.style.setProperty("--drop-out-index", outIndex);
    });

    document.querySelectorAll(".groupFold > .foldBtn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
            const group = btn.parentElement;
            btn.classList.remove("foldPulse");
            void btn.offsetWidth;

            clearTimeout(btn._foldPulseTimer);
            btn._foldPulseTimer = setTimeout(()=>btn.classList.remove("foldPulse"), 280);
            group.classList.toggle("expanded"); // 切换展开状态
            if (group.id === "globalGroup" && !group.classList.contains("expanded")){
              setLibraryDrawerOpen(false);
            }
        });
    });

    document.addEventListener("click", (e)=>{
        const btn = e.target.closest(".subBtn");
        if (!btn) return;

        btn.classList.remove("subPulse");
        void btn.offsetWidth;
        btn.classList.add("subPulse");
        clearTimeout(btn._subPulseTimer);
        btn._subPulseTimer = setTimeout(()=>btn.classList.remove("subPulse"), 200);
    }, true);

    const functionDrawer = document.querySelector(".topbar");
    const functionDrawerHandle = document.getElementById("functionDrawerHandle");
    const functionDrawerContent = document.getElementById("functionDrawerContent");
    const functionDrawerMQ = window.matchMedia("(orientation: portrait)");

    function collapseFunctionGroups(root = document){
      root.querySelectorAll(".groupFold.expanded").forEach(group => {
        group.classList.remove("expanded");
      });
    }

    function setFunctionDrawerOpen(open){
      if (!functionDrawer) return;
      if (open && !functionDrawerMQ.matches) return;
      functionDrawer.classList.toggle("drawerOpen", !!open);
      if (open){
        collapseFunctionGroups();
        functionDrawer.scrollTop = 0;
        functionDrawer.classList.remove("drawerOpening");
        void functionDrawer.offsetWidth;
        functionDrawer.classList.add("drawerOpening");
        clearTimeout(functionDrawer._drawerOpeningTimer);
        functionDrawer._drawerOpeningTimer = setTimeout(()=>{
          functionDrawer.classList.remove("drawerOpening");
        }, 420);
      } else {
        functionDrawer.classList.remove("drawerOpening");
        updateFloatingButtons();
      }
    }

    function isFunctionDrawerOpen(){
      return !!functionDrawer?.classList.contains("drawerOpen");
    }

    let drawerGesture = null;
    function beginDrawerGesture(e){
      if (!functionDrawerMQ.matches) return;
      if (
        e.currentTarget !== functionDrawerHandle &&
        e.target.closest("button, input, #libPanelWrap")
      ) return;
      drawerGesture = {
        id: e.pointerId,
        x: e.clientX,
        y: e.clientY,
        active: false
      };
      e.currentTarget.setPointerCapture?.(e.pointerId);
    }

    function moveDrawerGesture(e){
      if (!drawerGesture || drawerGesture.id !== e.pointerId) return;
      const dy = e.clientY - drawerGesture.y;
      if (Math.abs(dy) > 10) drawerGesture.active = true;
      if (drawerGesture.active){
        e.preventDefault();
        e.stopPropagation();
      }
    }

    function endDrawerGesture(e){
      if (!drawerGesture || drawerGesture.id !== e.pointerId) return;
      const dy = e.clientY - drawerGesture.y;
      const wasActive = drawerGesture.active;
      drawerGesture = null;
      if (!wasActive) return;
      if (dy > 46) setFunctionDrawerOpen(true);
      if (dy < -46) setFunctionDrawerOpen(false);
      e.preventDefault();
      e.stopPropagation();
    }

    function cancelDrawerGesture(){
      drawerGesture = null;
    }

    [functionDrawerHandle, functionDrawerContent].forEach(el => {
      el?.addEventListener("pointerdown", beginDrawerGesture, { passive:false });
      el?.addEventListener("pointermove", moveDrawerGesture, { passive:false });
      el?.addEventListener("pointerup", endDrawerGesture, { passive:false });
      el?.addEventListener("pointercancel", cancelDrawerGesture, { passive:true });
    });

    functionDrawerMQ.addEventListener?.("change", (e)=>{
      if (!e.matches) setFunctionDrawerOpen(false);
    });

    let lastHapticAt = 0;
    function hapticTick(duration = 8){
      if (!navigator.vibrate) return;
      const now = performance.now();
      if (now - lastHapticAt < 45) return;
      lastHapticAt = now;
      navigator.vibrate(duration);
    }

    function closeCaptureTour(){
      const existing = document.getElementById("captureTourContainer");
      existing?._close?.();
    }

    function showCaptureTour(clientX, clientY, sourceTap = null){
      closeCaptureTour();
      const container = document.createElement("div");
      container.id = "captureTourContainer";
      document.body.appendChild(container);

      const pad = 104;
      const cx = clamp(clientX, pad, window.innerWidth - pad);
      const cy = clamp(clientY, pad, window.innerHeight - pad);
      const items = [
        { mode:"mp",   png:"MP.png",   alt:"MP",   w:44, r:94 },
        { mode:"draw", png:"draw2.png", alt:"DRAW", w:48, r:98 },
        { mode:"rect", png:"rect.png", alt:"RECT", w:40, r:102, angleNudge:4 },
        { mode:"grid", png:"grid.png", alt:"GRID", w:46, r:102, angleNudge:8 }
      ];
      const tourArcCenter = Math.PI;
      const tourArcSpread = (76 / 180) * Math.PI;
      let centerRotation = Math.PI;
      let draggingDial = false;
      let hoveredIdx = -1;

      function close(){
        document.removeEventListener("pointerdown", onOutside, true);
        document.removeEventListener("pointermove", onDocPointerMove);
        document.removeEventListener("pointerup", onDocPointerUp);
        container.remove();
      }
      container._close = close;

      function pickItem(item){
        close();
        setCaptureMode(item.mode);
        if (item.mode === "mp" && sourceTap){
          handleMediaPipeTap(sourceTap);
        }
      }

      const center = document.createElement("img");
      center.id = "captureTourCenter";
      center.src = "assets/round.png";
      center.alt = "";
      center.draggable = false;
      center.style.left = cx + "px";
      center.style.top = cy + "px";
      center.style.transformOrigin = "center center";
      container.appendChild(center);

      const btnEls = [];
      items.forEach((item, i) => {
        const btn = document.createElement("button");
        btn.className = "captureTourBtn";
        btn.type = "button";
        btn.dataset.captureIdx = i;
        const angle = itemAngle(i);
        btn.style.left = (cx + Math.cos(angle) * item.r) + "px";
        btn.style.top = (cy + Math.sin(angle) * item.r) + "px";
        const img = document.createElement("img");
        img.src = "assets/" + item.png;
        img.alt = item.alt;
        img.style.width = item.w + "px";
        btn.appendChild(img);
        btn.addEventListener("click", (e)=>{
          e.preventDefault();
          e.stopPropagation();
          pickItem(item);
        });
        container.appendChild(btn);
        btnEls.push(btn);
      });

      function itemAngle(i){
        const t = items.length > 1 ? i / (items.length - 1) : 0.5;
        return tourArcCenter + tourArcSpread / 2 - t * tourArcSpread
          + ((items[i].angleNudge || 0) * Math.PI / 180);
      }

      function updateCenterRotation(){
        center.style.transform = `translate(-50%, -50%) rotate(${centerRotation - Math.PI}rad)`;
      }

      function highlightNearest(pointerAngle){
        let bestIdx = -1;
        let bestDist = Infinity;
        items.forEach((item, i)=>{
          let diff = pointerAngle - itemAngle(i);
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          const dist = Math.abs(diff);
          if (dist < bestDist){
            bestDist = dist;
            bestIdx = i;
          }
        });
        btnEls.forEach((btn, i)=>{
          if (i === bestIdx){
            btn.style.transform = "translate(-50%, -50%) scale(1.32)";
            btn.style.filter = "brightness(1.36)";
          } else {
            btn.style.transform = "translate(-50%, -50%) scale(1)";
            btn.style.filter = "none";
          }
        });
        if (bestIdx >= 0 && bestIdx !== hoveredIdx) hapticTick();
        return bestIdx;
      }

      center.addEventListener("pointerdown", (e)=>{
        draggingDial = true;
        hoveredIdx = -1;
        center.setPointerCapture?.(e.pointerId);
        const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
        centerRotation = angle;
        updateCenterRotation();
        hoveredIdx = highlightNearest(angle);
        e.preventDefault();
        e.stopPropagation();
      });

      function onDocPointerMove(e){
        if (!draggingDial) return;
        const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
        centerRotation = angle;
        updateCenterRotation();

const btnFxDistort = document.getElementById("btnFxDistort");

const brushSettings = {
  stretch: { radius: 4, strength: -100, radiusMin: 4, radiusMax: 120, strengthMin: -100, strengthMax: 100, showRadius: true, action: "done" },
  mblur:   { radius: 4, strength: 0, radiusMin: 4, radiusMax: 120, strengthMin: 0, strengthMax: 100, showRadius: true, action: "done" },
  mosaic:  { radius: 4, strength: 0, radiusMin: 4, radiusMax: 120, strengthMin: 0, strengthMax: 100, showRadius: true, action: "done" },
  bw:      { radius: 4, strength: 0, radiusMin: 4, radiusMax: 120, strengthMin: 0, strengthMax: 100, showRadius: false, action: "apply" },
  noise:   { radius: 4, strength: 0, radiusMin: 4, radiusMax: 120, strengthMin: 0, strengthMax: 100, showRadius: false, action: "apply" }
};

let activeBrushTool = "stretch";
const circularControls = [];

function currentBrushSettings(){
  return brushSettings[activeBrushTool] || brushSettings.stretch;
}

function clamp01(v){
  return Math.max(0, Math.min(1, v));
}

function mapRange(v, inMin, inMax, outMin, outMax){
  return outMin + clamp01((v - inMin) / (inMax - inMin || 1)) * (outMax - outMin);
}

function nearestDialAssetValue(uiValue){
  return Math.max(0, Math.min(120, Math.round(uiValue / 10) * 10));
}

// ===== Circular control sizing knobs =====
// 改这里就能单独调圆形控制的视觉大小：
const NUMBER_DIAL_ARC_DEG = 280;          // 数字环覆盖角度；越小，0 和 120 的缺口越大
const NUMBER_DIAL_SIZE_PX = 132;          // 整个圆形控制占位尺寸
const NUMBER_DIAL_TICK_RADIUS_PX = 70;    // 外圈数字离中心的距离
const NUMBER_DIAL_NUMBER_SIZE_PX = 24;    // 未单独指定时，0.png~120.png 的默认大小
const NUMBER_DIAL_NUMBER_SIZE_BY_VALUE = {
  0: 24,
  10: 24,
  20: 24,
  30: 24,
  40: 40,
  50: 38,
  60: 30,
  70: 24,
  80: 24,
  90: 24,
  100: 24,
  110: 24,
  120: 24
};
const NUMBER_DIAL_ACTIVE_SCALE = 1.32;    // 被指中的数字放大倍数
const NUMBER_DIAL_ROUND_SIZE_PX = 80;     // 中心 round.png 的大小
const NUMBER_DIAL_POINTER_OFFSET_DEG = 90; // round.png artwork points left; value 0 should point up.

function createCircularControl(inputEl, valueEl, options = {}){
  const pill = inputEl.closest(".pill");
  if (!pill) return null;
  const labelEl = pill.querySelector("span:first-child");
  pill.classList.add("floatingControl");
  if (!pill.dataset.floatingInitialized){
    const index = circularControls.length;
    pill.style.left = `${24 + (index % 2) * 154}px`;
    pill.style.top = `${Math.max(90, window.innerHeight - 190 - Math.floor(index / 2) * 154)}px`;
    pill.dataset.floatingInitialized = "1";
  }

  const dial = document.createElement("div");
  dial.className = "controlDial";
  dial.style.setProperty("--dial-size", `${NUMBER_DIAL_SIZE_PX}px`);
  dial.style.setProperty("--dial-number-size", `${NUMBER_DIAL_NUMBER_SIZE_PX}px`);
  dial.style.setProperty("--dial-round-size", `${NUMBER_DIAL_ROUND_SIZE_PX}px`);
  const ticks = [];
  const tickStart = options.tickStart ?? 0;
  const tickEnd = options.tickEnd ?? 120;
  const tickStep = options.tickStep ?? 10;
  const tickAssetValue = options.tickAssetValue || ((n)=>n);
  const tickAltValue = options.tickAltValue || tickAssetValue;
  for (let n = tickStart; n <= tickEnd; n += tickStep){
    const tick = document.createElement("img");
    tick.className = "controlDialTick";
    const assetValue = tickAssetValue(n);
    tick.src = `assets/${assetValue}.png`;
    tick.alt = String(tickAltValue(n));
    tick.style.width = `${NUMBER_DIAL_NUMBER_SIZE_BY_VALUE[n] || NUMBER_DIAL_NUMBER_SIZE_PX}px`;
    dial.appendChild(tick);
    ticks.push({ n, tick });
  }
  const center = document.createElement("img");
  center.className = "controlDialCenter";
  center.src = "assets/round.png";
  center.alt = "";
  const readout = document.createElement("div");
  readout.className = "controlDialReadout";
  dial.append(center, readout);
  valueEl.style.display = "none";
  pill.insertBefore(dial, valueEl);

  const ctrl = {
    inputEl,
    valueEl,
    dial,
    ticks,
    center,
    readout,
    labelEl,
    kind: options.kind || "number",
    uiMax: options.uiMax || 120,
    unit: options.unit || "",
    valueToUi: options.valueToUi || null,
    uiToValue: options.uiToValue || null,
    nearestTickValue: options.nearestTickValue || null,
    lastUiValue: null,
    lastHapticValue: null,
    update(){
      const realMin = Number(inputEl.min) || 0;
      const realMax = Number(inputEl.max) || 100;
      const real = Number(inputEl.value) || 0;
      const uiValue = this.kind === "angle"
        ? real
        : (this.valueToUi ? this.valueToUi(real, realMin, realMax) : mapRange(real, realMin, realMax, 0, this.uiMax));
      const deg = this.kind === "angle"
        ? real
        : mapRange(uiValue, 0, this.uiMax, 0, NUMBER_DIAL_ARC_DEG);
      const visualDeg = this.kind === "angle"
        ? deg
        : deg + NUMBER_DIAL_POINTER_OFFSET_DEG;
      center.style.transform = `translate(-50%, -50%) rotate(${visualDeg}deg)`;
      const tickRadius = NUMBER_DIAL_TICK_RADIUS_PX;
      const activeTickValue = this.nearestTickValue ? this.nearestTickValue(uiValue) : nearestDialAssetValue(uiValue);
      ticks.forEach(({ n, tick })=>{
        const tickAngle = mapRange(n, 0, 120, 0, NUMBER_DIAL_ARC_DEG * Math.PI / 180) - Math.PI / 2;
        const x = Math.cos(tickAngle) * tickRadius;
        const y = Math.sin(tickAngle) * tickRadius;
        const active = this.kind !== "angle" && n === activeTickValue;
        tick.classList.toggle("active", active);
        const scale = active ? NUMBER_DIAL_ACTIVE_SCALE : 1;
        tick.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;
        tick.style.opacity = this.kind === "angle" ? "0" : "1";
      });

      if (this.kind === "angle"){
        readout.textContent = pill.dataset.showDialLabel ? (labelEl?.textContent || "") : "";
      } else {
        readout.textContent = pill.dataset.showDialLabel ? (labelEl?.textContent || "") : "";
        this.lastUiValue = uiValue;
      }
    },
    setFromPointer(e){
      const rect = dial.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const raw = Math.atan2(e.clientY - cy, e.clientX - cx) + Math.PI / 2;
      const angle = (raw + Math.PI * 2) % (Math.PI * 2);
      const angleDeg = angle * 180 / Math.PI;
      if (this.kind !== "angle" && angleDeg > NUMBER_DIAL_ARC_DEG){
        return;
      }
      const frac = this.kind === "angle"
        ? angle / (Math.PI * 2)
        : Math.min(1, angleDeg / NUMBER_DIAL_ARC_DEG);
      const nextUiValue = frac * this.uiMax;
      if (
        this.kind !== "angle" &&
        this.lastUiValue != null &&
        Math.abs(nextUiValue - this.lastUiValue) > this.uiMax * 0.45
      ){
        return;
      }
      const realMin = Number(inputEl.min) || 0;
      const realMax = Number(inputEl.max) || 100;
      const real = this.kind === "angle"
        ? Math.round(frac * 360) % 360
        : (this.uiToValue ? this.uiToValue(nextUiValue, realMin, realMax) : Math.round(mapRange(nextUiValue, 0, this.uiMax, realMin, realMax)));
      const hapticValue = this.kind === "angle"
        ? Math.round(real / 15) * 15
        : (this.nearestTickValue ? this.nearestTickValue(nextUiValue) : nearestDialAssetValue(nextUiValue));
      if (hapticValue !== this.lastHapticValue){
        this.lastHapticValue = hapticValue;
        hapticTick();
      }
      inputEl.value = String(Math.max(realMin, Math.min(realMax, real)));
      inputEl.dispatchEvent(new Event("input", { bubbles: true }));
      this.update();
    }
  };

  let dragging = false;
  dial.addEventListener("pointerdown", (e)=>{
    dragging = true;
    dial.setPointerCapture(e.pointerId);
    ctrl.setFromPointer(e);
    e.preventDefault();
  });
  dial.addEventListener("pointermove", (e)=>{
    if (!dragging) return;
    ctrl.setFromPointer(e);
    e.preventDefault();
  });
  dial.addEventListener("pointerup", (e)=>{
    dragging = false;
    try { dial.releasePointerCapture(e.pointerId); } catch {}
  });
  dial.addEventListener("pointercancel", ()=>{
    dragging = false;
  });

  let centerPointerId = null;
  let centerStartX = 0;
  let centerStartY = 0;
  let moveDx = 0;
  let moveDy = 0;
  let moving = false;
  let rotatingFromCenter = false;
  let longPressTimer = 0;
  const CENTER_MOVE_LONG_PRESS_MS = 420;
  const CENTER_ROTATE_THRESHOLD_PX = 7;

  function movePillToPointer(e){
    const maxX = window.innerWidth - pill.offsetWidth;
    const maxY = window.innerHeight - pill.offsetHeight;
    pill.style.left = `${Math.max(0, Math.min(maxX, e.clientX - moveDx))}px`;
    pill.style.top = `${Math.max(0, Math.min(maxY, e.clientY - moveDy))}px`;
  }

  function startCenterMove(e){
    const rect = pill.getBoundingClientRect();
    moving = true;
    rotatingFromCenter = false;
    moveDx = e.clientX - rect.left;
    moveDy = e.clientY - rect.top;
    center.style.filter = "brightness(1.14)";
    readout.style.cursor = "grabbing";
  }

  function clearCenterGesture(){
    clearTimeout(longPressTimer);
    longPressTimer = 0;
    centerPointerId = null;
    moving = false;
    rotatingFromCenter = false;
    center.style.filter = "";
    readout.style.cursor = "";
  }

  function onCenterPointerDown(e){
    centerPointerId = e.pointerId;
    centerStartX = e.clientX;
    centerStartY = e.clientY;
    moving = false;
    rotatingFromCenter = false;
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(()=>startCenterMove(e), CENTER_MOVE_LONG_PRESS_MS);
    e.currentTarget.setPointerCapture(e.pointerId);
    e.preventDefault();
    e.stopPropagation();
  }

  function onCenterPointerMove(e){
    if (centerPointerId !== e.pointerId) return;
    const moved = Math.hypot(e.clientX - centerStartX, e.clientY - centerStartY);

    if (moving){
      movePillToPointer(e);
    } else {
      if (!rotatingFromCenter && moved > CENTER_ROTATE_THRESHOLD_PX){
        clearTimeout(longPressTimer);
        rotatingFromCenter = true;
      }
      if (rotatingFromCenter) ctrl.setFromPointer(e);
    }

    e.preventDefault();
    e.stopPropagation();
  }

  function onCenterPointerEnd(e){
    if (centerPointerId !== e.pointerId) return;
    try { e.currentTarget.releasePointerCapture(e.pointerId); } catch {}
    clearCenterGesture();
    e.preventDefault();
    e.stopPropagation();
  }

  [center, readout].forEach(el => {
    el.addEventListener("pointerdown", onCenterPointerDown);
    el.addEventListener("pointermove", onCenterPointerMove);
    el.addEventListener("pointerup", onCenterPointerEnd);
    el.addEventListener("pointercancel", onCenterPointerEnd);
  });

  circularControls.push(ctrl);
  ctrl.update();
  return ctrl;
}

function updateCircularControls(){
  circularControls.forEach(ctrl => ctrl.update());
}

function syncControlLabelVisibility(panel){
  if (!panel) return;
  const visibleControls = Array.from(panel.querySelectorAll(".pill"))
    .filter(el => getComputedStyle(el).display !== "none");

  visibleControls.forEach(el => {

  updateCircularControls();
}

function positionFloatingControlsNearSelected(panel){
  if (!panel || panel.style.display === "none") return;

  requestAnimationFrame(()=>{
    const controls = Array.from(panel.querySelectorAll(".pill"))
      .filter(el => getComputedStyle(el).display !== "none");
    if (!controls.length) return;

    const gap = 120;
    const margin = 10;
    const targetRect = selected?.el?.getBoundingClientRect?.();
    const baseRect = targetRect || {
      left: window.innerWidth / 2 - 40,
      right: window.innerWidth / 2 + 40,
      top: window.innerHeight / 2 - 40,
      bottom: window.innerHeight / 2 + 40,
      width: 80,
      height: 80
    };

    const totalW = controls.reduce((sum, el, i)=>sum + (el.offsetWidth || NUMBER_DIAL_SIZE_PX) + (i ? gap : 0), 0);
    const maxH = Math.max(...controls.map(el => el.offsetHeight || NUMBER_DIAL_SIZE_PX));
    let x = baseRect.left + baseRect.width / 2 - totalW / 2;
    x = Math.max(margin, Math.min(window.innerWidth - totalW - margin, x));

    let y = baseRect.top + baseRect.height * 0.7;
    y = Math.max(margin, Math.min(window.innerHeight - maxH - margin, y));

    controls.forEach((el, i)=>{
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      x += (el.offsetWidth || NUMBER_DIAL_SIZE_PX) + gap;
    });
  });
}

function positionGridControlsNearPendingRect(){
  if (!pendingGridRect || gridbar.style.display === "none") return;

  requestAnimationFrame(()=>{
    const controls = Array.from(gridbar.querySelectorAll(".pill"))
      .filter(el => getComputedStyle(el).display !== "none");
    if (controls.length < 2) return;

    const stageRect = stage.getBoundingClientRect();
    const viewportW = window.visualViewport?.width || window.innerWidth;
    const viewportH = window.visualViewport?.height || window.innerHeight;
    const margin = 12;
    const gap = 68;
    const sizes = controls.map(el => ({
      w: el.offsetWidth || NUMBER_DIAL_SIZE_PX,
      h: el.offsetHeight || NUMBER_DIAL_SIZE_PX
    }));

    const leftSize = sizes[0];
    const rightSize = sizes[1];
    const groupW = leftSize.w + gap + rightSize.w;
    const centerX = stageRect.left + pendingGridRect.x + pendingGridRect.w / 2;
    let x = centerX - groupW / 2;
    x = Math.max(margin, Math.min(viewportW - groupW - margin, x));

    const maxH = Math.max(leftSize.h, rightSize.h);
    const gridBottom = stageRect.top + pendingGridRect.y + pendingGridRect.h;
    const maxOverlap = Math.min(pendingGridRect.h * 0.30, maxH * 0.36);
    let y = gridBottom - maxOverlap;
    y = Math.max(margin, Math.min(viewportH - maxH - margin, y));

    controls[0].style.left = `${x}px`;
    controls[0].style.top = `${y}px`;
    controls[1].style.left = `${x + leftSize.w + gap}px`;
    controls[1].style.top = `${y}px`;
  });
}

function endLiveEffectPreview({ commit = true } = {}){
  if (!liveEffectPreview) return;
  const preview = liveEffectPreview;
  liveEffectPreview = null;

  if (!preview.st || preview.st !== selected) return;
  if (commit){
    paintUndoStack.push(preview.snap);
    paintRedoStack = [];
    if (paintUndoStack.length > 24) paintUndoStack.shift();
  } else {
    restoreStickerState(preview.st, preview.snap);
  }
}

function renderImageDataToSelected(baseImageData, pixelFn){
  if (!selected || !baseImageData) return;
  const c = selected.el;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  const next = new ImageData(new Uint8ClampedArray(baseImageData.data), baseImageData.width, baseImageData.height);
  const d = next.data;
  for (let i=0; i<d.length; i+=4){
    if (d[i+3] === 0) continue;
    pixelFn(d, i);
  }
  ctx.putImageData(next, 0, 0);
}

function renderBlackWhitePreview(amount){
  const base = liveEffectPreview?.snap?.imageData;
  const mix = clamp(amount, 0, 1);
  renderImageDataToSelected(base, (d, i)=>{
    const r = d[i], g = d[i+1], b = d[i+2];
    const y = (0.2126*r + 0.7152*g + 0.0722*b) | 0;
    d[i]   = clamp(r + (y - r) * mix, 0, 255);
    d[i+1] = clamp(g + (y - g) * mix, 0, 255);
    d[i+2] = clamp(b + (y - b) * mix, 0, 255);
  });
}

function renderNoisePreview(amount){
  const base = liveEffectPreview?.snap?.imageData;
  const amp = clamp(amount, 0, 1) * 255;
  renderImageDataToSelected(base, (d, i)=>{
    const h = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
    const n = (h - Math.floor(h)) * 2 * amp - amp;
    d[i]   = clamp(d[i]   + n, 0, 255);
    d[i+1] = clamp(d[i+1] + n, 0, 255);
    d[i+2] = clamp(d[i+2] + n, 0, 255);
  });
}

function updateLiveEffectPreview(){
  if (!liveEffectPreview || !selected || liveEffectPreview.st !== selected) return;
  if (activeBrushTool === "bw"){
    renderBlackWhitePreview(getBrushStrength() / 100);
  }
  if (activeBrushTool === "noise"){
    const amt = Math.abs(getBrushStrength()) / 100;
    renderNoisePreview(clamp(amt * 0.45, 0, 0.45));
  }
}

    // ===== MAGNET v2: Shape Field (LOOP / PATH) + Dock binding =====

        const rect = panel.getBoundingClientRect();
        dragging = true;
        dx = e.clientX - rect.left;
        dy = e.clientY - rect.top;
        panel.style.left = rect.left + "px";
        panel.style.top = rect.top + "px";
        panel.style.right = "auto";
        panel.style.bottom = "auto";
        panel.style.transform = "none";
        panel.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

        if (!dragging) return;
        const maxX = window.innerWidth - panel.offsetWidth;
        const maxY = window.innerHeight - panel.offsetHeight;
        const x = clamp(e.clientX - dx, 0, Math.max(0, maxX));
        const y = clamp(e.clientY - dy, 0, Math.max(0, maxY));
        panel.style.left = x + "px";
        panel.style.top = y + "px";
      });

      panel.addEventListener("pointerup", (e)=>{
        dragging = false;
        try { panel.releasePointerCapture(e.pointerId); } catch {}
      });

function dataURLToBlob(dataURL){
  const arr = dataURL.split(",");
  const mime = arr[0].match(/:(.*?);/)?.[1] || "image/png";
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--){
    u8arr[n] = bstr.charCodeAt(n);
  }
  return new Blob([u8arr], { type: mime });
}

function placeCacheKey(lat, lng){
  return `${Number(lat).toFixed(3)},${Number(lng).toFixed(3)}`;
}

async function reverseGeocodePlace(lat, lng){
  if (lat == null || lng == null) return null;

  const key = placeCacheKey(lat, lng);
  const cache = readPlaceCache();
  if (cache[key]) return cache[key];

  const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lng)}&localityLanguage=en`;
  const res = await fetch(url);
  if (!res.ok) return null;

  const data = await res.json();
  const place = [
    data.city || data.locality || data.principalSubdivision,
    data.countryName
  ].filter(Boolean).join(", ");

  if (!place) return null;
  cache[key] = place;
  writePlaceCache(cache);
  return place;
}

function locationFallbackText(geo){
  if (!geo?.lat) return "(no location)";
  const accuracy = geo.source === "ip"
    ? "approx"
    : `+/-${Math.round(geo.accuracy_m || 0)}m`;
  return `${geo.lat.toFixed(5)}, ${geo.lng.toFixed(5)} ${accuracy}`;
}

function locationPlaceText(place, geo){
  return place ? `${place} | ${locationFallbackText(geo)}` : locationFallbackText(geo);
}

function fillPlaceText(el, geo){
  if (!geo?.lat){
    el.textContent = "(no location)";
    return;
  }

  el.textContent = locationFallbackText(geo);
  reverseGeocodePlace(geo.lat, geo.lng)
    .then(place=>{
      if (place) el.textContent = locationPlaceText(place, geo);
    })
    .catch(err=>console.warn("reverse geocode failed:", err));
}

function openPoemArchiveDB(){
  return new Promise((resolve, reject)=>{
    if (!window.indexedDB) {
      reject(new Error("IndexedDB unavailable"));
      return;
    }

    const req = indexedDB.open(POEM_ARCHIVE_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(POEM_ARCHIVE_STORE)){
        db.createObjectStore(POEM_ARCHIVE_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function loadLocalPoemArchive(){
  try{
    const db = await openPoemArchiveDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(POEM_ARCHIVE_STORE, "readonly");
      const store = tx.objectStore(POEM_ARCHIVE_STORE);
      const req = store.getAll();
      req.onsuccess = () => {
        const items = req.result || [];
        if (!items.length){
          try{
            const legacy = JSON.parse(localStorage.getItem(POEM_ARCHIVE_KEY) || "[]");
            if (legacy.length){
              savePoemArchive(legacy).catch(console.warn);
              resolve(legacy);
              return;
            }
          }catch{}
        }
        items.sort((a, b)=> new Date(b.created_at || 0) - new Date(a.created_at || 0));
        resolve(items);
      };
      req.onerror = () => reject(req.error);
      tx.oncomplete = () => db.close();
    });
  }catch(err){
    console.warn("IndexedDB poem load failed; falling back to localStorage:", err);
    try{
      return JSON.parse(localStorage.getItem(POEM_ARCHIVE_KEY) || "[]");
    }catch{
      return [];
    }
  }
}

async function saveLocalPoemArchive(items){
  try{
    const db = await openPoemArchiveDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(POEM_ARCHIVE_STORE, "readwrite");
      const store = tx.objectStore(POEM_ARCHIVE_STORE);
      store.clear();
      items.forEach(item => store.put(item));
      tx.oncomplete = () => {
        db.close();
        resolve();
      };
      tx.onerror = () => reject(tx.error);
    });
    try { localStorage.removeItem(POEM_ARCHIVE_KEY); } catch {}
  }catch(err){
    console.warn("IndexedDB poem save failed; falling back to localStorage:", err);
    localStorage.setItem(POEM_ARCHIVE_KEY, JSON.stringify(items));
  }
}

function drawVideoBackgroundToCanvas(ctx, w, h){
  const frame = getVideoFrameCanvas();
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);
  if (!frame) return;

  const videoAspect = frame.width / frame.height;
  const canvasAspect = w / h;
  let dw, dh, dx, dy;
  if (canvasAspect > videoAspect){
    dw = w;
    dh = w / videoAspect;
    dx = 0;
    dy = (h - dh) / 2;
  } else {
    dh = h;
    dw = h * videoAspect;
    dx = (w - dw) / 2;
    dy = 0;
  }

  ctx.save();
  ctx.filter = video.style.filter && video.style.filter !== "none" ? video.style.filter : "none";
  if (facingMode === "user"){
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(frame, dx, dy, dw, dh);
  } else {
    ctx.drawImage(frame, dx, dy, dw, dh);
  }
  ctx.restore();
  ctx.filter = "none";
}

function drawStickersToCanvas(ctx){
  for (const st of stickers){
    ctx.save();
    ctx.translate(st.x + st.w / 2, st.y + st.h / 2);
    ctx.rotate(st.rot || 0);
    ctx.scale(st.scale || 1, st.scale || 1);
    ctx.filter = st.blurPx > 0 ? `blur(${st.blurPx}px)` : "none";
    ctx.drawImage(st.el, -st.w / 2, -st.h / 2, st.w, st.h);
    ctx.restore();
  }
  ctx.filter = "none";
}

function renderCompositionDataURL({ includeBackground = true, maxSide = 1400, type = "image/png", quality = 0.86 } = {}){
  const r = stage.getBoundingClientRect();
  const fitScale = Math.min(1, maxSide / Math.max(r.width || 1, r.height || 1));
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2)) * fitScale;
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(r.width * dpr));
  c.height = Math.max(1, Math.round(r.height * dpr));
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (includeBackground) drawVideoBackgroundToCanvas(ctx, r.width, r.height);
  else ctx.clearRect(0, 0, r.width, r.height);
  drawStickersToCanvas(ctx);
  return c.toDataURL(type, quality);
}

function serializeCurrentProject(){
  const r = stage.getBoundingClientRect();
  return {
    canvas: { w: r.width, h: r.height },
    stickers: stickers.map(st => ({
      dataURL: stickerToArchiveDataURL(st),
      x: st.x,
      y: st.y,
      w: st.w,
      h: st.h,
      scale: st.scale || 1,
      rot: st.rot || 0,
      blurPx: st.blurPx || 0,
      sideOn: !!st.sideOn
    }))
  };
}

function stickerToArchiveDataURL(st){
  const maxSide = 900;
  const src = st.el;
  const largest = Math.max(src.width, src.height);
  if (largest <= maxSide) return stickerToDataURL(st);

  const scale = maxSide / largest;
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(src.width * scale));
  c.height = Math.max(1, Math.round(src.height * scale));
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/png");
}

    if (title === null) return;

    showHint("Saving poem...", 700);
    const now = Date.now();
    const poem = {
      id: crypto.randomUUID(),
      title: title.trim() || defaultPoemTitle(),
      created_at: new Date(now).toISOString(),
      updated_at: new Date(now).toISOString(),

        includeBackground: true,
        maxSide: 900,
        type: "image/jpeg",
        quality: 0.78

    };
    const cloudPoem = await uploadCurrentPoemToSupabase(poem);
    selectedPoemId = cloudPoem.id;
    await refreshLibraryUI();
    showHint("Poem saved", 900);

    getGeoOnce({ timeout: 1800 })
      .then(async geo => {
        if (!geo) return;
        const place = await reverseGeocodePlace(geo.lat, geo.lng).catch(()=>"");
        await updateCloudPoemLocation(poem.id, geo, place || "");
        if (libraryMode === "archive") await refreshLibraryUI();
      })
      .catch(err => console.warn("poem location update failed:", err));
  }catch(err){
    console.error("save poem failed:", err);
    showHint(`Save Poem failed: ${err?.message || err}`, 2200);
  }
}

async function getGeoOnce({ highAccuracy = true, timeout = 6500 } = {}) {
  const ipGeoFallback = async () => {
    try{
      const res = await fetch("https://ipapi.co/json/");
      if (!res.ok) throw new Error("ip geolocation fetch failed");

      const data = await res.json();
      const lat = Number(data.latitude);
      const lng = Number(data.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;

      const place = [data.city, data.country_name].filter(Boolean).join(", ");
      if (place){
        const cache = readPlaceCache();
        cache[placeCacheKey(lat, lng)] = place;
        writePlaceCache(cache);
      }

      return {
        lat,
        lng,
        accuracy_m: 0,
        ts: Date.now(),
        source: "ip"
      };
    }catch(err){
      console.warn("ip geolocation fallback failed:", err);
      return null;
    }
  };

  if (!navigator.geolocation) return await ipGeoFallback();

  const geoErrorName = (err) => {
    if (!err) return "UNKNOWN";
    if (err.code === err.PERMISSION_DENIED || err.code === 1) return "PERMISSION_DENIED";
    if (err.code === err.POSITION_UNAVAILABLE || err.code === 2) return "POSITION_UNAVAILABLE";
    if (err.code === err.TIMEOUT || err.code === 3) return "TIMEOUT";
    return `CODE_${err.code || "UNKNOWN"}`;
  };

  const logGeoError = (label, err) => {
    console.warn(`${label}: ${geoErrorName(err)}`, {
      code: err?.code,
      message: err?.message
    });
  };

  const readPosition = (opts) => new Promise((resolve) => {
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({
        geo: {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy_m: pos.coords.accuracy,
          ts: pos.timestamp,
          source: "gps"
        },
        err: null
      }),
      (err) => resolve({ geo: null, err }),
      opts
    );
  });

  const first = await readPosition({
    enableHighAccuracy: highAccuracy,
    timeout,
    maximumAge: 15000
  });
  if (first.geo) return first.geo;
  if (first.err?.code === 1) {
    logGeoError("geolocation denied", first.err);
    showHint("GPS denied, using approximate network location", 1600);
    return await ipGeoFallback();
  }

  const fallback = await readPosition({
    enableHighAccuracy: false,
    timeout: 9000,
    maximumAge: 60000
  });
  if (fallback.geo) return fallback.geo;

  logGeoError("geolocation error", fallback.err || first.err);
  showHint(`GPS unavailable: ${geoErrorName(fallback.err || first.err)}. Trying network location`, 1400);
  return await ipGeoFallback();
}

function pointInPoly(x, y, pts){
  // ray casting
  let inside = false;
  for (let i=0, j=pts.length-1; i<pts.length; j=i++){
    const xi=pts[i].x, yi=pts[i].y;
    const xj=pts[j].x, yj=pts[j].y;
    const intersect = ((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi+1e-9) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function drawFieldOverlay(pts, kind, bindText){
  // 画在 magnetPreview 上（持久显示场）
  clearMagnetPreview();
  if (!pts || pts.length < 2) return;

  mctx.save();
  mctx.lineWidth = 2;
  mctx.lineCap = "round";
  mctx.lineJoin = "round";

  // 主描边
  mctx.strokeStyle = "rgba(120,200,255,.78)";
  // loop 填充
  mctx.fillStyle   = "rgba(120,200,255,.12)";

  mctx.beginPath();
  mctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1; i<pts.length; i++) mctx.lineTo(pts[i].x, pts[i].y);

  if (kind === "loop"){
    mctx.closePath();
    mctx.fill();
  }
  mctx.stroke();

  // 角标文字
  mctx.fillStyle = "rgba(255,255,255,.78)";
  mctx.font = "12px system-ui";
  mctx.fillText(`FIELD: ${bindText}`, pts[0].x + 8, pts[0].y - 8);

  mctx.restore();
}

function assignDocksForField(){
  if (!field || !stickers.length) return;
  field.docks.clear();

  const pts = field.pts;

  // bbox
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  for (const p of pts){
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
  }

  // spacing（防堆叠）
  const minDist = 30;
  const taken = [];
  const ok = (p)=>{
    for (const q of taken){
      if (Math.hypot(p.x-q.x, p.y-q.y) < minDist) return false;
    }
    return true;
  };

  // PATH：严格在线上（取路径上的点分配）
  if (field.kind === "path"){
    const candidates = pts.filter((_,i)=> i%2===0);
    for (let i=0; i<stickers.length; i++){
      const st = stickers[i];
      const idx = Math.floor(i * (candidates.length-1) / Math.max(1, stickers.length-1));
      const p = candidates[clamp(idx,0,candidates.length-1)];
      field.docks.set(st, { x:p.x, y:p.y });
    }
    return;
  }

  // LOOP：IN/OUT：严格在多边形内/外
  const PAD = 160; // OUT 的外扩范围（先做简单强绑定版，之后可升级成“贴圈外环”）
  const bx0 = (field.bind === "out") ? (minX - PAD) : minX;
  const by0 = (field.bind === "out") ? (minY - PAD) : minY;
  const bx1 = (field.bind === "out") ? (maxX + PAD) : maxX;
  const by1 = (field.bind === "out") ? (maxY + PAD) : maxY;

  for (const st of stickers){
    let found = null;

    for (let k=0; k<1400; k++){
      const x = bx0 + Math.random() * (bx1 - bx0);
      const y = by0 + Math.random() * (by1 - by0);

      const inside = pointInPoly(x,y,pts);
      if (field.bind === "in"  && !inside) continue;
      if (field.bind === "out" &&  inside) continue;

      const cand = {x,y};
      if (!ok(cand)) continue;

      found = cand;
      taken.push(cand);
      break;
    }

    // fallback：避免找不到点卡死
    if (!found){
      found = (field.bind === "in")
        ? { x:(minX+maxX)/2, y:(minY+maxY)/2 }
        : { x:bx1, y:by1 };
      taken.push(found);
    }

    field.docks.set(st, found);
  }
}

async function initModel(){
  const onboardingFallbackTimer = setTimeout(()=>{
    startOnboardingGuide();
    showHint("MP is still loading. Draw, Rect and Grid are ready.", 1500);
  }, 5000);

  const modelHint = (text)=>{
    loader.style.display = "none";
    showHint(text, 2200);
  };

  try{
    const vendorUrl = new URL("./vendor/", location.href).href;
    const bundleUrl = new URL("./vendor/vision_bundle.mjs", location.href).href;
    const modelUrl = new URL("./models/magic_touch.tflite", location.href).href;

    modelHint("Preparing to load MediaPipe...");
    console.log("[MP init] bundle:", bundleUrl);
    console.log("[MP init] vendor:", vendorUrl);
    console.log("[MP init] model:", modelUrl);

    const mod = await import(bundleUrl);
    InteractiveSegmenter = mod.InteractiveSegmenter;
    FilesetResolver = mod.FilesetResolver;

    modelHint("Initializing Vision WASM...");
    const vision = await FilesetResolver.forVisionTasks(vendorUrl);

    modelHint("Fetching model...");
    const modelBuffer = await fetchInitBuffer(modelUrl, "model");
    console.log("[MP init] model bytes:", modelBuffer.byteLength);

    modelHint("Loading model...");
    const modelBytes = new Uint8Array(modelBuffer);
    const attempts = [
      async () => {
        console.log("[MP init] trying createFromOptions + modelAssetBuffer");
        return await InteractiveSegmenter.createFromOptions(vision,{
          baseOptions:{
            modelAssetBuffer: modelBytes,
            delegate:"CPU"
          },
          outputCategoryMask:true,
          outputConfidenceMasks:false
        });
      },
      async () => {
        console.log("[MP init] trying createFromModelBuffer fallback");
        const seg = await InteractiveSegmenter.createFromModelBuffer(vision, modelBytes);
        await seg.setOptions({
          outputCategoryMask:true,
          outputConfidenceMasks:false
        });
        return seg;
      },
      async () => {
        console.log("[MP init] trying createFromOptions + modelAssetPath fallback");
        return await InteractiveSegmenter.createFromOptions(vision,{
          baseOptions:{
            modelAssetPath:modelUrl,
            delegate:"CPU"
          },
          outputCategoryMask:true,
          outputConfidenceMasks:false
        });
      }
    ];

    const errors = [];
    for (const attempt of attempts){
      try{
        interactiveSegmenter = await attempt();
        break;
      }catch(err){
        errors.push(initErrorText(err));
        console.warn("[MP init attempt failed]", err);
      }
    }
    if (!interactiveSegmenter){
      throw new Error(errors.join("\n--- fallback ---\n"));
    }

    loader.style.display = "none";
    clearTimeout(showHint._t);
    hint.classList.remove("show");
    startOnboardingGuide();
    showHint("MP capture is ready", 900);

  }catch(err){
    const details = initErrorText(err);
    console.error("[MP init failed]", err);
    loader.style.display = "none";
    showHint("MediaPipe model failed to load. Other capture modes are still available.", 1800);
    setTimeout(startOnboardingGuide, 1900);
  }finally{
    clearTimeout(onboardingFallbackTimer);
  }
}
